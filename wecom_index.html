<!DOCTYPE html><html lang="zh-cmn"><head><meta charset="UTF-8"><meta http-equiv="X-UA-Compatible" content="IE=Edge"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"><title>企业微信-验证码</title><script src="https://captcha.gtimg.com/TCaptcha.js"></script></head><body> <script type="text/javascript" src="//wwcdn.weixin.qq.com/node/wwdeveloper/wwdeveloper/js/modules/jquery/jquery/1.11.3/jquery.min$b3c48411.js"></script> <script src="https://captcha.gtimg.com/TCaptcha.js"></script><script>
function showDeveloperCaptcha(options) {
try {
var captcha = new TencentCaptcha('2019113749', function(res) {
if (res.ticket){
var xhr = new XMLHttpRequest();
xhr.open("GET", '/security/verify?ticket=' + res.ticket + '&randstr=' + res.randstr, true);
xhr.onreadystatechange = function () {
if (xhr.readyState === 4 && xhr.status === 200) {
const resData = JSON.parse(xhr.responseText)
if(resData.data.allow) {
options.success()
captcha.destroy()
} else {
captcha.refresh()
}
} else {
captcha.refresh()
}
};
xhr.send();
}
},
{
ready: function(){},
needFeedBack: true,
type: options.type
}
);
captcha.show();
} catch (error) {
console.error(error)
}
}</script> <script>showDeveloperCaptcha({
success: function() {
location.reload()
},
type: 'inline',
})</script></body>
