{
  "domain": "kf",
  "operations": [
    {
      "name": "account_add",
      "cli_action": "account-add",
      "summary": "添加客服账号",
      "method": "POST",
      "endpoint": "/cgi-bin/kf/account/add",
      "args": [
        {
          "name": "name",
          "flag": "--name",
          "type": "str",
          "help": "客服名称 不多于16个字符",
          "required": true
        },
        {
          "name": "media_id",
          "flag": "--media-id",
          "type": "str",
          "help": "客服头像临时素材。可以调用上传临时素材接口获取。 不多于128个字节",
          "required": true
        }
      ],
      "request": {
        "json_body": {
          "name": {
            "from_arg": "name"
          },
          "media_id": {
            "from_arg": "media_id"
          }
        }
      },
      "examples": [
        "wecom kf account-add --name <name> --media-id <media_id>"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "返回码"
            },
            "errmsg": {
              "type": "string",
              "description": "错误码描述"
            },
            "open_kfid": {
              "type": "string",
              "description": "新创建的客服账号ID"
            }
          },
          "required": [
            "errcode",
            "errmsg",
            "open_kfid"
          ]
        }
      },
      "doc": {
        "title": "添加客服账号",
        "source_url": "https://developer.work.weixin.qq.com/document/path/94662",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/kf/account/add?access_token=ACCESS_TOKEN",
        "request_params": [
          {
            "name": "access_token",
            "required": true,
            "description": "调用接口凭证",
            "type": "string"
          },
          {
            "name": "name",
            "required": true,
            "description": "客服名称 不多于16个字符",
            "type": "string"
          },
          {
            "name": "media_id",
            "required": true,
            "description": "客服头像临时素材。可以调用上传临时素材接口获取。 不多于128个字节",
            "type": "string"
          }
        ],
        "response_params": [
          {
            "name": "errcode",
            "required": null,
            "description": "返回码",
            "type": "int32"
          },
          {
            "name": "errmsg",
            "required": null,
            "description": "错误码描述",
            "type": "string"
          },
          {
            "name": "open_kfid",
            "required": null,
            "description": "新创建的客服账号ID",
            "type": "string"
          }
        ],
        "request_example_text": "{\n    \"name\": \"新建的客服账号\",\n    \"media_id\": \"294DpAog3YA5b9rTK4PjjfRfYLO0L5qpDHAJIzhhQ2jAEWjb9i661Q4lk8oFnPtmj\"\n}",
        "request_example_json": {
          "name": "新建的客服账号",
          "media_id": "294DpAog3YA5b9rTK4PjjfRfYLO0L5qpDHAJIzhhQ2jAEWjb9i661Q4lk8oFnPtmj"
        },
        "response_example_text": "{\n    \"errcode\": 0,\n    \"errmsg\": \"ok\",\n    \"open_kfid\": \"wkAJ2GCAAAZSfhHCt7IFSvLKtMPxyJTw\"\n}",
        "response_example_json": {
          "errcode": 0,
          "errmsg": "ok",
          "open_kfid": "wkAJ2GCAAAZSfhHCt7IFSvLKtMPxyJTw"
        },
        "permissions": [
          "注： 从2023年12月1日0点起，不再支持通过系统应用secret调用接口，存量企业暂不受影响 查看详情\n \n通过接口创建的客服账号，将自动拥有该客服账号的管理权限。企业可在管理后台“微信客服-通过API管理微信客服账号”处设置对应的客服账号通过API来管理。"
        ]
      }
    },
