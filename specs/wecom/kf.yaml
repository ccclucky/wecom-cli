          "required": true
        }
      ],
      "request": {
        "json_body": {
          "open_kfid": {
            "from_arg": "open_kfid"
          },
          "servicer_userid": {
            "from_arg": "servicer_userid"
          },
          "start_time": {
            "from_arg": "start_time"
          },
