      ],
      "doc": {
        "title": "获取「客户数据统计」接待人员明细数据",
        "source_url": "https://developer.work.weixin.qq.com/document/path/95490",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/kf/get_servicer_statistic?access_token=ACCESS_TOKEN",
        "request_params": [
          {
            "name": "access_token",
            "required": true,
            "description": "调用接口凭证",
            "type": "string"
          },
          {
            "name": "open_kfid",
            "required": true,
            "description": "客服账号ID",
            "type": "string"
          },
          {
            "name": "servicer_userid",
            "required": false,
            "description": "接待人员的userid。第三方应用为密文userid，即open_userid",
            "type": "string"
          },
          {
            "name": "start_time",
            "required": true,
            "description": "起始日期的时间戳，填当天的0时0分0秒（否则系统自动处理为当天的0分0秒）。取值范围：昨天至前180天",
            "type": "uint32"
          },
          {
            "name": "end_time",
            "required": true,
            "description": "结束日期的时间戳，填当天的0时0分0秒（否则系统自动处理为当天的0分0秒）。取值范围：昨天至前180天",
            "type": "uint32"
          }
        ],
        "response_params": [
          {
            "name": "errcode",
            "required": null,
            "description": "返回码",
            "type": "int32"
          },
          {
            "name": "errmsg",
            "required": null,
            "description": "错误码描述",
            "type": "string"
          },
          {
            "name": "statistic_list",
            "required": null,
            "description": "统计数据列表",
            "type": "obj"
          },
          {
            "name": "statistic_list_stat_time",
            "required": null,
            "description": "数据统计日期，为当日0点的时间戳",
            "type": "uint32"
          },
          {
            "name": "statistic_list_statistic",
            "required": null,
            "description": "一天的统计数据。若当天未产生任何下列统计数据或统计数据还未计算完成则不会返回此项",
            "type": "obj"
          },
          {
            "name": "statistic_list_statistic_session_cnt",
            "required": null,
            "description": "接入人工会话数。客户发过消息并分配给接待人员的咨询会话数",
            "type": "uint64"
          },
          {
            "name": "statistic_list_statistic_customer_cnt",
            "required": null,
            "description": "咨询客户数。在会话中发送过消息且接入了人工会话的客户数量，若客户多次咨询只计算一个客户",
            "type": "uint64"
          },
          {
            "name": "statistic_list_statistic_customer_msg_cnt",
            "required": null,
            "description": "咨询消息总数。客户在会话中发送的消息的数量",
            "type": "uint64"
          },
          {
            "name": "statistic_list_statistic_reply_rate",
            "required": null,
            "description": "人工回复率。一个自然日内，客户给接待人员发消息的会话中，接待人员回复了的会话的占比。若数据项不返回，代表没有给接待人员发送消息的客户，此项无法计算。",
            "type": "float"
          },
          {
            "name": "statistic_list_statistic_first_reply_average_sec",
            "required": null,
            "description": "平均首次响应时长，单位：秒。一个自然日内，客户给接待人员发送的第一条消息至接待人员回复之间的时长，为首次响应时长。所有的首次回复总时长/已回复的咨询会话数，即为平均首次响应时长 。若数据项不返回，代表没有给接待人员发送消息的客户，此项无法计算",
            "type": "float"
          },
          {
            "name": "statistic_list_statistic_satisfaction_investgate_cnt",
            "required": null,
            "description": "满意度评价发送数。当api托管了会话分配，满意度原生功能失效，满意度评价发送数为0",
            "type": "uint64"
          },
          {
            "name": "statistic_list_statistic_satisfaction_participation_rate",
            "required": null,
            "description": "满意度参评率 。当api托管了会话分配，满意度原生功能失效。若数据项不返回，代表没有发送满意度评价，此项无法计算",
            "type": "float"
          },
          {
            "name": "statistic_list_statistic_satisfied_rate",
            "required": null,
            "description": "“满意”评价占比 。在客户参评的满意度评价中，评价是“满意”的占比。当api托管了会话分配，满意度原生功能失效。若数据项不返回，代表没有客户参评的满意度评价，此项无法计算",
            "type": "float"
          },
          {
            "name": "statistic_list_statistic_middling_rate",
            "required": null,
            "description": "“一般”评价占比 。在客户参评的满意度评价中，评价是“一般”的占比。当api托管了会话分配，满意度原生功能失效。若数据项不返回，代表没有客户参评的满意度评价，此项无法计算",
            "type": "float"
          },
          {
            "name": "statistic_list_statistic_dissatisfied_rate",
            "required": null,
            "description": "“不满意”评价占比。在客户参评的满意度评价中，评价是“不满意”的占比。当api托管了会话分配，满意度原生功能失效。若数据项不返回，代表没有客户参评的满意度评价，此项无法计算",
            "type": "float"
          },
          {
            "name": "statistic_list_statistic_upgrade_service_customer_cnt",
            "required": null,
            "description": "升级服务客户数。通过「升级服务」功能成功添加专员或加入客户群的客户数，若同一个客户添加多个专员或客户群，只计算一个客户。在2022年3月10日以后才会有对应统计数据",
            "type": "uint64"
          },
          {
            "name": "statistic_list_statistic_upgrade_service_member_invite_cnt",
            "required": null,
            "description": "专员服务邀请数。接待人员通过「升级服务-专员服务」向客户发送服务专员名片的次数。在2022年3月10日以后才会有对应统计数据",
            "type": "uint64"
          },
          {
            "name": "statistic_list_statistic_upgrade_service_member_customer_cnt",
            "required": null,
            "description": "添加专员的客户数 。客户成功添加专员为好友的数量，若同一个客户添加多个专员，则计算多个客户数。在2022年3月10日以后才会有对应统计数据",
            "type": "uint64"
          },
          {
            "name": "statistic_list_statistic_upgrade_service_groupchat_invite_cnt",
            "required": null,
            "description": "客户群服务邀请数。接待人员通过「升级服务-客户群服务」向客户发送客户群二维码的次数。在2022年3月10日以后才会有对应统计数据",
            "type": "uint64"
          },
          {
            "name": "statistic_list_statistic_upgrade_service_groupchat_customer_cnt",
            "required": null,
            "description": "加入客户群的客户数。客户成功加入客户群的数量，若同一个客户加多个客户群，则计算多个客户数。在2022年3月10日以后才会有对应统计数据",
            "type": "uint64"
          },
          {
            "name": "statistic_list_statistic_msg_rejected_customer_cnt",
            "required": null,
            "description": "被拒收消息的客户数。被接待人员设置了“不再接收消息”的客户数",
            "type": "uint64"
          }
        ],
        "request_example_text": "{\n    \"open_kfid\": \"OPEN_KFID\",\n\t\"servicer_userid\":\"zhangsan\",\n    \"start_time\": 1645545600,\n\t\"end_time\": 1645632000\n}",
        "request_example_json": {
          "open_kfid": "OPEN_KFID",
          "servicer_userid": "zhangsan",
          "start_time": 1645545600,
          "end_time": 1645632000
        },
        "response_example_text": "{\n    \"errcode\": 0,\n    \"errmsg\": \"ok\",\n\t\"statistic_list\" : [\n            {\n                \"stat_time\" : 1645545600,\n                \"statistic\" : {\n                    \"session_cnt\" : 1,\n                    \"customer_cnt\" : 1,\n                    \"customer_msg_cnt\" : 1,\n                    \"reply_rate\" : 1,\n                    \"first_reply_average_sec\" : 17,\n                    \"satisfaction_investgate_cnt\" : 1,\n                    \"satisfaction_participation_rate\" : 1,\n                    \"satisfied_rate\" : 1,\n                    \"middling_rate\" : 0,\n                    \"dissatisfied_rate\" : 0,\n                    \"upgrade_service_customer_cnt\" : 0,\n                    \"upgrade_service_member_invite_cnt\" : 0,\n                    \"upgrade_service_member_customer_cnt\" : 0,\n                    \"upgrade_service_groupchat_invite_cnt\" : 0,\n                    \"upgrade_service_groupchat_customer_cnt\" : 0,\n                    \"msg_rejected_customer_cnt\" : 1\n                }\n            },\n\t\t\t{\n\t\t\t\t \"stat_time\" : 1645632000,\n\t\t\t\t \"statistic\" : {\n\t\t\t\t \t...\n\t\t\t\t }\n\t\t\t}\n        ]\n}",
        "permissions": [
          "注： 从2023年12月1日0点起，不再支持通过系统应用secret调用接口，存量企业暂不受影响 查看详情"
        ],
        "notes": [
          "servicer_userid为非必填参数:\n1. 不指定servicer_userid，返回客服账号维度汇总数据；\n2. 指定servicer_userid，返回该接待人员在此客服账号下的数据。",
          "查询时间区间[start_time, end_time]为闭区间，最大查询跨度为31天，用户最多可获取最近180天内的数据。当天的数据需要等到第二天才能获取，建议在第二天早上六点以后再调用此接口获取前一天的数据",
          "当传入的时间不为0点时，会向下取整，如传入1554296400(Wed Apr 3 21:00:00 CST 2019)会被自动转换为1554220800（Wed Apr 3 00:00:00 CST 2019）;",
          "开启API或授权第三方应用管理会话，没有2022年3月11日以前的统计数据"
        ],
        "review_hints": [
          "Review doc.notes for conditional fields, limits, and permission caveats."
        ]
      }
