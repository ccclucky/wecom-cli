        },
        {
          "name": "servicer_userid",
          "flag": "--servicer-userid",
          "type": "str",
          "help": "接待人员的userid。第三方应用为密文userid，即open_userid"
        },
        {
          "name": "start_time",
          "flag": "--start-time",
          "type": "str",
          "help": "起始日期的时间戳，填当天的0时0分0秒（否则系统自动处理为当天的0分0秒）。取值范围：昨天至前180天",
          "required": true
        },
        {
          "name": "end_time",
          "flag": "--end-time",
