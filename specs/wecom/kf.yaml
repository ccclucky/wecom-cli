    {
      "name": "get_corp_statistic",
      "cli_action": "get-corp-statistic",
      "summary": "获取「客户数据统计」企业汇总数据",
      "method": "POST",
      "endpoint": "/cgi-bin/kf/get_corp_statistic",
      "args": [
        {
          "name": "open_kfid",
          "flag": "--open-kfid",
          "type": "str",
          "help": "客服账号ID",
          "required": true
        },
        {
          "name": "start_time",
          "flag": "--start-time",
          "type": "str",
          "help": "起始日期的时间戳，填这一天的0时0分0秒（否则系统自动处理为当天的0分0秒）。取值范围：昨天至前180天",
          "required": true
        },
        {
          "name": "end_time",
          "flag": "--end-time",
          "type": "str",
          "help": "结束日期的时间戳，填这一天的0时0分0秒（否则系统自动处理为当天的0分0秒）。取值范围：昨天至前180天",
          "required": true
        }
      ],
      "request": {
        "json_body": {
          "open_kfid": {
            "from_arg": "open_kfid"
          },
          "start_time": {
            "from_arg": "start_time"
          },
          "end_time": {
            "from_arg": "end_time"
          }
        }
      },
      "examples": [
        "wecom kf get-corp-statistic --open-kfid <open_kfid> --start-time <start_time> --end-time <end_time>"
      ],
      "doc": {
        "title": "获取「客户数据统计」企业汇总数据",
        "source_url": "https://developer.work.weixin.qq.com/document/path/95489",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/kf/get_corp_statistic?access_token=ACCESS_TOKEN",
        "request_params": [
          {
            "name": "access_token",
            "required": true,
            "description": "调用接口凭证",
            "type": "string"
          },
          {
            "name": "open_kfid",
            "required": true,
            "description": "客服账号ID",
            "type": "string"
          },
          {
            "name": "start_time",
            "required": true,
            "description": "起始日期的时间戳，填这一天的0时0分0秒（否则系统自动处理为当天的0分0秒）。取值范围：昨天至前180天",
            "type": "uint32"
          },
          {
            "name": "end_time",
            "required": true,
            "description": "结束日期的时间戳，填这一天的0时0分0秒（否则系统自动处理为当天的0分0秒）。取值范围：昨天至前180天",
            "type": "uint32"
          }
        ],
        "response_params": [
          {
            "name": "errcode",
            "required": null,
            "description": "返回码",
            "type": "int32"
          },
          {
            "name": "errmsg",
            "required": null,
            "description": "错误码描述",
            "type": "string"
          },
          {
            "name": "statistic_list",
            "required": null,
            "description": "统计数据列表",
            "type": "obj"
          },
          {
            "name": "statistic_list_stat_time",
            "required": null,
            "description": "数据统计日期，为当日0点的时间戳",
            "type": "uint32"
          },
          {
            "name": "statistic_list_statistic",
            "required": null,
            "description": "一天的统计数据。若当天未产生任何下列统计数据或统计数据还未计算完成则不会返回此项",
            "type": "obj"
          },
          {
            "name": "statistic_list_statistic_session_cnt",
            "required": null,
            "description": "咨询会话数。客户发过消息并分配给接待人员或智能助手的客服会话数，转接不会产生新的会话",
            "type": "uint64"
          },
          {
            "name": "statistic_list_statistic_customer_cnt",
            "required": null,
            "description": "咨询客户数。在会话中发送过消息的客户数量，若客户多次咨询只计算一个客户",
            "type": "uint64"
          },
          {
            "name": "statistic_list_statistic_customer_msg_cnt",
            "required": null,
            "description": "咨询消息总数。客户在会话中发送的消息的数量",
            "type": "uint64"
          },
          {
            "name": "statistic_list_statistic_upgrade_service_customer_cnt",
            "required": null,
            "description": "升级服务客户数。通过「升级服务」功能成功添加专员或加入客户群的客户数，若同一个客户添加多个专员或客户群，只计算一个客户。在2022年3月10日以后才会有对应统计数据",
            "type": "uint64"
          },
          {
            "name": "statistic_list_statistic_ai_session_reply_cnt",
            "required": null,
            "description": "智能回复会话数。客户发过消息并分配给智能助手的咨询会话数。通过API发消息或者开启智能回复功能会将客户分配给智能助手",
            "type": "uint64"
          },
          {
            "name": "statistic_list_statistic_ai_transfer_rate",
            "required": null,
            "description": "转人工率。一个自然日内，客户给智能助手发消息的会话中，转人工的会话的占比。",
            "type": "float"
          },
          {
            "name": "statistic_list_statistic_ai_knowledge_hit_rate",
            "required": null,
            "description": "知识命中率。一个自然日内，客户给智能助手发送的消息中，命中知识库的占比。只有在开启了智能回复原生功能并配置了知识库的情况下，才会产生该项统计数据。当api托管了会话分配，智能回复原生功能失效。若不返回，代表没有向配置知识库的智能接待助手发送消息，该项无法计算",
            "type": "float"
          },
          {
            "name": "statistic_list_statistic_msg_rejected_customer_cnt",
            "required": null,
            "description": "被拒收消息的客户数。被接待人员设置了“不再接收消息”的客户数",
            "type": "uint64"
          }
        ],
        "request_example_text": "{\n    \"open_kfid\": \"OPEN_KFID\",\n    \"start_time\": 1645545600,\n\t\"end_time\": 1645632000\n}",
        "request_example_json": {
          "open_kfid": "OPEN_KFID",
          "start_time": 1645545600,
          "end_time": 1645632000
        },
        "response_example_text": "{\n    \"errcode\": 0,\n    \"errmsg\": \"ok\",\n\t\"statistic_list\" : [\n            {\n                \"stat_time\" : 1645545600,\n                \"statistic\" : {\n                    \"session_cnt\" : 2,\n                    \"customer_cnt\" : 1,\n                    \"customer_msg_cnt\" : 6,\n                    \"upgrade_service_customer_cnt\" : 0,\n                    \"ai_session_reply_cnt\" : 1,\n                    \"ai_transfer_rate\" : 1,\n                    \"ai_knowledge_hit_rate\" : 0,\n                    \"msg_rejected_customer_cnt\" : 1\n                },\n            },\n\t\t\t {\n                 \"stat_time\" : 1645632000,\n                 \"statistic\" : {\n                     ...\n                 }\n            }\n        ]\n}",
        "permissions": [
          "注： 从2023年12月1日0点起，不再支持通过系统应用secret调用接口，存量企业暂不受影响 查看详情"
        ],
        "notes": [
          "查询时间区间[start_time, end_time]为闭区间，最大查询跨度为31天，用户最多可获取最近180天内的数据。当天的数据需要等到第二天才能获取，建议在第二天早上六点以后再调用此接口获取前一天的数据",
          "当传入的时间不为0点时，会向下取整，如传入1554296400(Wed Apr 3 21:00:00 CST 2019)会被自动转换为1554220800（Wed Apr 3 00:00:00 CST 2019）;",
          "开启API或授权第三方应用管理会话，没有2022年3月11日以前的统计数据"
        ],
        "review_hints": [
          "Review doc.notes for conditional fields, limits, and permission caveats."
        ]
      }
    },
    {
      "name": "get_servicer_statistic",
      "cli_action": "get-servicer-statistic",
      "summary": "获取「客户数据统计」接待人员明细数据",
      "method": "POST",
      "endpoint": "/cgi-bin/kf/get_servicer_statistic",
      "args": [
        {
          "name": "open_kfid",
          "flag": "--open-kfid",
