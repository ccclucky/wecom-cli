            "name": "meeting_option_enable_enter_mute",
            "required": false,
            "description": "成员入会时是否静音 1:开启；0:关闭；2:超过6人后自动开启静音。默认超过6人自动开启静音",
            "type": "int"
          },
          {
            "name": "meeting_option_remind_scope",
