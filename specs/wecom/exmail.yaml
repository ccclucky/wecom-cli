          },
          {
            "name": "schedule_reminders_remind_before_event_mins",
            "required": false,
            "description": "会议开始（start_time）前多少分钟提醒，当is_remind=1时有效。例如： 15表示会议开始前15分钟提醒 -15表示会议开始后15分钟提醒",
            "type": "int"
          },
          {
            "name": "schedule_reminders_timezone",
            "required": false,
            "description": "时区。UTC偏移量表示(即偏离零时区的小时数)，东区为正数，西区为负数。 例如：+8 表示北京时间东八区 默认为北京时间东八区 取值范围：-12 ~ +12",
            "type": "int"
          },
          {
            "name": "schedule_reminders_is_repeat",
            "required": false,
            "description": "是否重复 0-否 1-是",
            "type": "int"
          },
          {
            "name": "schedule_reminders_is_custom_repeat",
            "required": false,
            "description": "是否自定义重复 0-否 1-是。当is_repeat为1时有效。",
            "type": "int"
          },
          {
            "name": "schedule_reminders_repeat_type",
            "required": false,
