            "required": false,
            "description": "每周周几重复 仅当指定为自定义重复且重复类型为每周时有效 取值范围：1 ~ 7，分别表示周一至周日",
            "type": "int[]"
          },
          {
            "name": "schedule_reminders_repeat_day_of_month",
            "required": false,
            "description": "每月哪几天重复 仅当指定为自定义重复, 且重复类型为每月或每年时有效 取值范围：1 ~ 31，分别表示1~31号",
            "type": "int[]"
          },
          {
            "name": "schedule_reminders_repeat_month_of_year",
