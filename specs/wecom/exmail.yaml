        "title": "更新邮件群组",
        "source_url": "https://developer.work.weixin.qq.com/document/path/97995",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/exmail/group/update?access_token=ACCESS_TOKEN",
        "request_params": [
          {
            "name": "groupid",
            "required": true,
            "description": "邮件群组ID，邮箱格式",
            "type": "string"
          },
          {
            "name": "groupname",
            "required": false,
            "description": "邮件群组名称，不能与其他群组重名，长度限定200字节",
            "type": "string"
          },
          {
            "name": "email_list",
            "required": false,
            "description": "群组内成员邮箱地址，读取成员的biz_mail字段，不传则不变，传空则清空。成员由email_list，group_list，department_list，tag_list共同组成，不允许全部清空",
            "type": "string"
          },
          {
            "name": "tag_list",
            "required": false,
            "description": "群组内包含的标签ID，不传则不变，传空为清空",
            "type": "uint32"
          },
          {
            "name": "department_list",
            "required": false,
            "description": "群组内包含的部门ID，不传则不变，传空为清空",
            "type": "uint32"
          },
          {
            "name": "group_list",
            "required": false,
            "description": "群组内包含的群组邮箱ID，不传则不变，传空为清空",
            "type": "string"
          },
          {
            "name": "allow_type",
            "required": false,
            "description": "群组使用权限。0: 企业成员, 1任何人， 2:组内成员，3:自定义成员。当值为0、1、2时，不得传入allow_emaillist，allow_departmentlist，allow_taglist。当值为3时，必须传入allow_emaillist，allow_departmentlist，allow_taglist至少一项。若不需更新则不传入参数。",
            "type": "uint32"
          },
          {
            "name": "allow_emaillist",
            "required": false,
            "description": "允许使用群组群发的成员邮箱地址，不传则不变，传空为清空",
            "type": "string"
          },
          {
            "name": "allow_departmentlist",
            "required": false,
            "description": "允许使用群组群发的部门ID，不传则不变，传空为清空",
            "type": "uint32"
          },
          {
            "name": "allow_taglist",
            "required": false,
            "description": "允许使用群组群发的标签ID，不传则不变，传空为清空",
            "type": "uint32"
          }
        ],
        "response_params": [
          {
            "name": "errcode",
            "required": null,
            "description": "错误码",
            "type": "int32"
          },
          {
            "name": "errmsg",
            "required": null,
            "description": "错误码说明",
            "type": "string"
          }
