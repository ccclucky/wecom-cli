{
  "domain": "exmail",
  "operations": [
    {
      "name": "app_compose_send",
      "cli_action": "app-compose-send",
      "summary": "发送会议邮件",
      "method": "POST",
      "endpoint": "/cgi-bin/exmail/app/compose_send",
      "args": [
        {
          "name": "to",
          "flag": "--to",
          "type": "str",
          "help": "收件人，to.emails 和 to.userids 至少传一个",
          "required": true
        },
        {
          "name": "to_emails",
          "flag": "--to-emails",
          "type": "str",
          "help": "收件人，邮箱地址"
        },
        {
          "name": "to_userids",
          "flag": "--to-userids",
          "type": "str",
          "help": "收件人，企业内成员的userid"
        },
        {
          "name": "cc",
          "flag": "--cc",
          "type": "str",
          "help": "抄送"
        },
        {
          "name": "cc_emails",
          "flag": "--cc-emails",
          "type": "str",
          "help": "抄送人，邮箱地址"
        },
        {
          "name": "cc_userids",
          "flag": "--cc-userids",
          "type": "str",
          "help": "抄送人，企业内成员的userid"
        },
        {
          "name": "bcc",
          "flag": "--bcc",
          "type": "str",
          "help": "密送"
        },
        {
          "name": "bcc_emails",
          "flag": "--bcc-emails",
          "type": "str",
          "help": "密送人，邮箱地址"
        },
        {
          "name": "bcc_userids",
          "flag": "--bcc-userids",
          "type": "str",
          "help": "密送人，企业内成员的userid"
        },
        {
          "name": "subject",
          "flag": "--subject",
          "type": "str",
          "help": "邮件标题，同时也是会议标题",
          "required": true
        },
        {
          "name": "content",
          "flag": "--content",
          "type": "str",
          "help": "邮件正文，同时是会议描述",
          "required": true
        },
        {
          "name": "attachment_list",
          "flag": "--attachment-list",
          "type": "str",
          "help": "附件相关"
        },
        {
          "name": "attachment_list_file_name",
          "flag": "--attachment-list-file-name",
          "type": "str",
          "help": "文件名",
          "required": true
        },
        {
          "name": "attachment_list_content",
          "flag": "--attachment-list-content",
          "type": "str",
          "help": "文件内容（base64编码），所有附件加正文的大小不允许超过50M, 且附件个数不能超过200个",
          "required": true
        },
        {
          "name": "content_type",
          "flag": "--content-type",
          "type": "str",
          "help": "内容类型 html，text（默认是html）"
        },
        {
          "name": "schedule",
          "flag": "--schedule",
          "type": "str",
          "help": "会议相关数据，发会议邮件都必须带上这个字段",
          "required": true
        },
        {
          "name": "schedule_schedule_id",
          "flag": "--schedule-schedule-id",
          "type": "str",
          "help": "会议ID (修改/取消会议必须带上schedule_id)"
        },
        {
          "name": "schedule_method",
          "flag": "--schedule-method",
          "type": "str",
          "help": "会议方法： request-请求（不传schedule_id时是创建会议，传了是修改会议） cancel-取消会议（必须带上schedule_id） 默认为request"
        },
        {
          "name": "schedule_location",
          "flag": "--schedule-location",
          "type": "str",
          "help": "地点"
        },
        {
          "name": "schedule_start_time",
          "flag": "--schedule-start-time",
          "type": "int",
          "help": "会议开始时间，Unix时间戳",
          "required": true
        },
        {
          "name": "schedule_end_time",
          "flag": "--schedule-end-time",
          "type": "int",
          "help": "会议结束时间，Unix时间戳",
          "required": true
        },
        {
          "name": "schedule_reminders",
          "flag": "--schedule-reminders",
          "type": "str",
          "help": "重复和提醒相关字段"
        },
        {
          "name": "schedule_reminders_is_remind",
          "flag": "--schedule-reminders-is-remind",
          "type": "bool",
          "help": "是否有提醒 0-不提醒 1-提醒"
        },
        {
          "name": "schedule_reminders_remind_before_event_mins",
          "flag": "--schedule-reminders-remind-before-event-mins",
          "type": "int",
          "help": "会议开始（start_time）前多少分钟提醒，当is_remind=1时有效。例如： 15表示会议开始前15分钟提醒 -15表示会议开始后15分钟提醒"
        },
        {
          "name": "schedule_reminders_timezone",
          "flag": "--schedule-reminders-timezone",
          "type": "int",
          "help": "时区。UTC偏移量表示(即偏离零时区的小时数)，东区为正数，西区为负数。 例如：+8 表示北京时间东八区 默认为北京时间东八区 取值范围：-12 ~ +12"
        },
        {
          "name": "schedule_reminders_is_repeat",
          "flag": "--schedule-reminders-is-repeat",
          "type": "bool",
          "help": "是否重复 0-否 1-是"
        },
        {
          "name": "schedule_reminders_is_custom_repeat",
          "flag": "--schedule-reminders-is-custom-repeat",
          "type": "bool",
          "help": "是否自定义重复 0-否 1-是。当is_repeat为1时有效。"
        },
        {
          "name": "schedule_reminders_repeat_type",
          "flag": "--schedule-reminders-repeat-type",
          "type": "int",
          "help": "重复类型，当is_repeat=1时有效。目前支持如下类型： 0 - 每日 1 - 每周 2 - 每月 5 - 每年"
        },
        {
          "name": "schedule_reminders_repeat_interval",
          "flag": "--schedule-reminders-repeat-interval",
          "type": "int",
          "help": "重复间隔 仅当指定为自定义重复时有效，该字段随repeat_type不同而含义不同 例如： repeat_interval指定为2，repeat_type指定为每周重复，那么每2周重复一次； repeat_interval指定为2，repeat_type指定为每月重复，那么每2月重复一次"
        },
        {
          "name": "schedule_reminders_repeat_day_of_week",
          "flag": "--schedule-reminders-repeat-day-of-week",
          "type": "str",
          "help": "每周周几重复 仅当指定为自定义重复且重复类型为每周时有效 取值范围：1 ~ 7，分别表示周一至周日"
        },
        {
          "name": "schedule_reminders_repeat_day_of_month",
          "flag": "--schedule-reminders-repeat-day-of-month",
          "type": "str",
          "help": "每月哪几天重复 仅当指定为自定义重复, 且重复类型为每月或每年时有效 取值范围：1 ~ 31，分别表示1~31号"
        },
        {
          "name": "schedule_reminders_repeat_month_of_year",
          "flag": "--schedule-reminders-repeat-month-of-year",
          "type": "str",
          "help": "每年哪几个月重复 仅当指定为自定义重复且重复类型为每年时有效 取值范围：1 ~ 12，分别表示 1月 - 12月（每年重复需要repeat_month_of_year和repeat_day_of_month来指定某一天）"
        },
        {
          "name": "schedule_reminders_repeat_until",
          "flag": "--schedule-reminders-repeat-until",
          "type": "int",
          "help": "重复结束时刻，Unix时间戳，当is_repeat=1时有效。不填或填0表示一直重复"
        },
        {
          "name": "meeting",
          "flag": "--meeting",
          "type": "str",
          "help": "会议相关，会议邮件必填，且必须同时带上schedule，会议的基本设置放在schedule里"
        },
        {
          "name": "meeting_hosts",
          "flag": "--meeting-hosts",
          "type": "str",
          "help": "会议主持人列表，最多10个。定义见收件人字段，只支持填userid"
        },
        {
          "name": "meeting_meeting_admins",
          "flag": "--meeting-meeting-admins",
          "type": "str",
          "help": "会议管理员字段, , 仅可指定1人，只支持传userid，必须是同企业的用户，且在参与人中",
          "required": true
        },
        {
          "name": "meeting_option",
          "flag": "--meeting-option",
          "type": "str",
          "help": "会议相关设置"
        },
        {
          "name": "meeting_option_password",
          "flag": "--meeting-option-password",
          "type": "str",
          "help": "入会密码，仅可输入4-6位纯数字"
        },
        {
          "name": "meeting_option_auto_record",
          "flag": "--meeting-option-auto-record",
          "type": "bool",
          "help": "是否自动录制 0：未开启自动录制，1：开启自动本地录制，2：开启自动云录制；默认不开启"
        },
        {
          "name": "meeting_option_enable_waiting_room",
          "flag": "--meeting-option-enable-waiting-room",
          "type": "bool",
          "help": "是否开启等候室 false:不开启等候室；true:开启等候室；默认不开"
        },
        {
          "name": "meeting_option_allow_enter_before_host",
          "flag": "--meeting-option-allow-enter-before-host",
          "type": "bool",
          "help": "是否允许成员在主持人进会前加入。 true:允许；false:不允许。默认允许"
        },
        {
          "name": "meeting_option_enter_restraint",
          "flag": "--meeting-option-enter-restraint",
          "type": "bool",
          "help": "是否限制成员入会 0:所有人可入会 2:仅企业内部用户可入会；默认所有人可入会"
        },
        {
          "name": "meeting_option_enable_screen_watermark",
          "flag": "--meeting-option-enable-screen-watermark",
          "type": "bool",
          "help": "是否开启屏幕水印 true:开启；false:不开启。默认不开启"
        },
        {
          "name": "meeting_option_enable_enter_mute",
          "flag": "--meeting-option-enable-enter-mute",
          "type": "bool",
          "help": "成员入会时是否静音 1:开启；0:关闭；2:超过6人后自动开启静音。默认超过6人自动开启静音"
        },
        {
          "name": "meeting_option_remind_scope",
          "flag": "--meeting-option-remind-scope",
          "type": "bool",
          "help": "会议开始时是否提醒 1:不提醒 2:仅提醒主持人 3:提醒所有成员入会; 默认仅提醒主持人"
        },
        {
          "name": "meeting_option_water_mark_type",
          "flag": "--meeting-option-water-mark-type",
          "type": "int",
          "help": "水印类型 0:单排水印 1:多排水印；默认单排水印"
        },
        {
          "name": "enable_id_trans",
          "flag": "--enable-id-trans",
          "type": "bool",
          "help": "表示是否开启id转译，0表示否，1表示是，默认0。仅第三方应用需要用到，企业自建应用可以忽略。 目前仅subject、content、attachment_list[].file_name字段支持转译。"
        }
      ],
