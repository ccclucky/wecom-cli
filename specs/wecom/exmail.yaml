            "description": "每年哪几个月重复 仅当指定为自定义重复且重复类型为每年时有效 取值范围：1 ~ 12，分别表示 1月 - 12月（每年重复需要repeat_month_of_year和repeat_day_of_month来指定某一天）",
            "type": "int[]"
          },
          {
            "name": "schedule_reminders_repeat_until",
