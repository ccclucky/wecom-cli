{
  "domain": "corp",
  "operations": [
    {
      "name": "get_join_qrcode",
      "cli_action": "get-join-qrcode",
      "summary": "获取加入企业二维码",
      "method": "GET",
      "endpoint": "/cgi-bin/corp/get_join_qrcode",
      "args": [
        {
          "name": "size_type",
          "flag": "--size-type",
          "type": "str",
          "help": "qrcode尺寸类型，1: 171 x 171; 2: 399 x 399; 3: 741 x 741; 4: 2052 x 2052"
        }
      ],
      "request": {
        "query": {
          "size_type": {
            "from_arg": "size_type"
          }
        }
      },
      "examples": [
        "wecom corp get-join-qrcode"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "返回码"
            },
            "errmsg": {
              "type": "string",
              "description": "对返回码的文本描述内容"
            },
            "join_qrcode": {
              "type": "string",
              "description": "二维码链接，有效期7天"
            }
          },
          "required": [
            "errcode",
            "errmsg",
            "join_qrcode"
          ]
        }
      },
      "doc": {
        "title": "获取加入企业二维码",
        "source_url": "https://developer.work.weixin.qq.com/document/path/91714",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/corp/get_join_qrcode?access_token=ACCESS_TOKEN&size_type=SIZE_TYPE",
        "request_params": [
          {
            "name": "access_token",
            "required": true,
            "description": "调用接口凭证",
            "type": null
          },
          {
            "name": "size_type",
            "required": false,
            "description": "qrcode尺寸类型，1: 171 x 171; 2: 399 x 399; 3: 741 x 741; 4: 2052 x 2052",
            "type": null
          }
        ],
        "response_params": [
          {
            "name": "errcode",
            "required": null,
            "description": "返回码",
            "type": null
          },
          {
            "name": "errmsg",
            "required": null,
            "description": "对返回码的文本描述内容",
            "type": null
          },
          {
            "name": "join_qrcode",
            "required": null,
            "description": "二维码链接，有效期7天",
            "type": null
          }
        ],
        "response_example_text": "{\n   \"errcode\": 0,\n   \"errmsg\": \"ok\",\n   \"join_qrcode\": \"https://work.weixin.qq.com/wework_admin/genqrcode?action=join&vcode=3db1fab03118ae2aa1544cb9abe84&r=hb_share_api_mjoin&qr_size=3\"\n}",
        "response_example_json": {
          "errcode": 0,
          "errmsg": "ok",
          "join_qrcode": "https://work.weixin.qq.com/wework_admin/genqrcode?action=join&vcode=3db1fab03118ae2aa1544cb9abe84&r=hb_share_api_mjoin&qr_size=3"
        }
      }
