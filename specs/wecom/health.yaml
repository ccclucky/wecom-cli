                  "id_type": {
                    "type": "integer"
                  },
                  "userid": {
                    "type": "string"
                  },
                  "report_time": {
                    "type": "integer"
                  },
                  "report_values": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "question_id": {
                          "type": "integer"
                        },
                        "single_choice": {
                          "type": "integer"
                        }
                      },
                      "required": [
                        "question_id",
                        "single_choice"
                      ]
                    }
                  }
                },
                "required": [
                  "id_type",
                  "userid",
                  "report_time",
                  "report_values"
                ]
              },
              "description": "答案列表"
            }
          },
          "required": [
            "errcode",
            "errmsg",
            "answers"
          ]
        }
      },
