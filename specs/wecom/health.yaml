      "args": [
        {
          "name": "jobid",
          "flag": "--jobid",
          "type": "str",
          "help": "任务ID",
          "required": true
        },
        {
          "name": "date",
          "flag": "--date",
          "type": "str",
          "help": "具体某天任务的填写答案，仅支持获取最近14天数据",
          "required": true
        },
        {
          "name": "offset",
          "flag": "--offset",
          "type": "str",
          "help": "数据偏移量"
        },
        {
          "name": "limit",
          "flag": "--limit",
          "type": "str",
          "help": "拉取的数据量，最大值100"
        }
      ],
      "request": {
        "json_body": {
          "jobid": {
            "from_arg": "jobid"
          },
          "date": {
            "from_arg": "date"
          },
          "offset": {
            "from_arg": "offset"
          },
          "limit": {
            "from_arg": "limit"
          }
        }
      },
      "examples": [
        "wecom health get-report-answer --jobid <jobid> --date <date> [--offset <offset>] [--limit <limit>]"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "返回码"
            },
            "errmsg": {
              "type": "string",
              "description": "对返回码的文本描述内容"
