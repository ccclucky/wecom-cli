{
  "domain": "health",
  "operations": [
    {
      "name": "get_health_report_stat",
      "cli_action": "get-health-report-stat",
      "summary": "获取健康上报使用统计",
      "method": "POST",
      "endpoint": "/cgi-bin/health/get_health_report_stat",
      "args": [
        {
          "name": "date",
          "flag": "--date",
          "type": "str",
          "help": "具体某天的使用统计，最长支持获取30天前数据",
          "required": true
        }
      ],
      "request": {
        "json_body": {
          "date": {
            "from_arg": "date"
          }
        }
      },
      "examples": [
        "wecom health get-health-report-stat --date <date>"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "返回码"
            },
            "errmsg": {
              "type": "string",
              "description": "对返回码的文本描述内容"
            },
            "pv": {
              "type": "integer",
              "description": "应用使用次数"
            },
            "uv": {
              "type": "integer",
              "description": "应用使用成员数"
            }
          },
          "required": [
            "errcode",
            "errmsg",
            "pv",
            "uv"
          ]
        }
      },
      "doc": {
        "title": "获取健康上报使用统计",
        "source_url": "https://developer.work.weixin.qq.com/document/path/93676",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/health/get_health_report_stat?access_token=ACCESS_TOKEN",
        "request_params": [
          {
            "name": "access_token",
            "required": true,
            "description": "调用接口凭证。",
            "type": null
          },
          {
            "name": "date",
            "required": true,
            "description": "具体某天的使用统计，最长支持获取30天前数据",
            "type": null
          }
        ],
        "response_params": [
          {
            "name": "errcode",
            "required": null,
            "description": "返回码",
            "type": null
          },
          {
            "name": "errmsg",
            "required": null,
            "description": "对返回码的文本描述内容",
            "type": null
          },
          {
            "name": "pv",
            "required": null,
            "description": "应用使用次数",
            "type": null
          },
          {
            "name": "uv",
            "required": null,
            "description": "应用使用成员数",
            "type": null
          }
        ],
        "request_example_text": "{\n\t\"date\": \"2020-03-27\"\n}",
        "request_example_json": {
          "date": "2020-03-27"
        },
        "response_example_text": "{\n   \"errcode\": 0,\n   \"errmsg\": \"ok\",\n   \"pv\": 100,\n   \"uv\": 50\n}",
        "response_example_json": {
          "errcode": 0,
          "errmsg": "ok",
          "pv": 100,
          "uv": 50
