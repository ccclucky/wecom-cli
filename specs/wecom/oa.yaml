      "doc": {
        "title": "创建审批模板",
        "source_url": "https://developer.work.weixin.qq.com/document/path/97437",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/oa/approval/create_template?access_token=ACCESS_TOKEN",
        "request_params": [
          {
            "name": "access_token",
            "required": true,
            "description": "调用接口凭证",
            "type": null
          },
          {
            "name": "template_name",
            "required": true,
            "description": "模版名称数组",
            "type": null
          },
          {
            "name": "text",
            "required": true,
            "description": "模版名称。需满足以下条件：1-模版名称不得和现有模版名称重复；2-长度不得超过40个字符。",
            "type": null
          },
          {
            "name": "lang",
            "required": true,
            "description": "显示语言，中文：zh_CN（注意不是zh-CN）",
            "type": null
          },
          {
            "name": "template_content",
            "required": true,
            "description": "审批模版控件设置，由多个表单控件及其内容组成，其中包含需要对控件赋值的信息",
            "type": null
          },
          {
            "name": "controls",
            "required": true,
            "description": "控件数组，模版中可以设置多个控件类型，排列顺序和管理端展示的相同",
            "type": null
          },
          {
            "name": "property",
            "required": true,
            "description": "控件的基础属性",
            "type": null
          },
          {
            "name": "control",
            "required": true,
            "description": "控件类型：Text-文本；Textarea-多行文本；Number-数字；Money-金额；Date-日期/日期+时间；Selector-单选/多选；；Contact-成员/部门；Tips-说明文字；File-附件；Table-明细；Location-位置；RelatedApproval-关联审批单；DateRange-时长；PhoneNumber-电话号码；Vacation-假期；Attendance-外出/出差/加班；BankAccount-收款账户 。以上为目前可支持的控件类型",
            "type": null
          },
          {
            "name": "id",
            "required": true,
            "description": "控件id。1-模版内控件id必须唯一；2-控件id格式：control-数字，如\"Text-01\"",
            "type": null
          },
          {
            "name": "title",
            "required": true,
            "description": "控件名称",
            "type": null
          },
          {
            "name": "text_1",
            "required": true,
            "description": "控件名称。需满足以下条件：1-控件名称不得和现有控件名称重复；2-长度不得超过40个字符。3-Attendance-外出/出差/加班控件title固定为外出/出差/加班，暂不支持自定义",
            "type": null
          },
          {
            "name": "lang_1",
            "required": true,
            "description": "显示语言，中文：zh_CN（注意不是zh-CN）",
            "type": null
          },
          {
            "name": "placeholder",
            "required": false,
            "description": "控件说明，假勤组件（Vacation、Attendance）暂不支持设置",
            "type": null
          },
          {
            "name": "text_2",
            "required": false,
            "description": "控件说明。需满足以下条件：长度不得超过80个字符。",
            "type": null
          },
          {
            "name": "lang_2",
            "required": false,
            "description": "显示语言，中文：zh_CN（注意不是zh-CN）；若text填写，则该项为必填",
            "type": null
          },
          {
            "name": "require",
            "required": false,
            "description": "控件是否必填。0-非必填；1-必填；默认为0;假勤组件（Vacation、Attendance）不支持设置非必填",
            "type": null
          },
          {
            "name": "un_print",
            "required": false,
            "description": "控件是否可打印。0-可打印；1-不可打印；默认为0；假勤组件（Vacation、Attendance）不支持设置不可打印",
            "type": null
          },
          {
            "name": "config",
            "required": null,
            "description": "控件配置。控件的类型不同，其中填的参数不相同，下方将为每一个控件配置进行详细说明",
            "type": null
          }
        ],
        "response_params": [
          {
            "name": "errcode",
            "required": null,
            "description": "错误码，详情见错误码说明",
            "type": null
          },
          {
            "name": "errmsg",
            "required": null,
            "description": "错误码对应的错误信息提示",
            "type": null
          },
          {
            "name": "template_id",
            "required": null,
            "description": "模版创建成功后返回的模版id",
            "type": null
          }
        ],
        "request_example_text": "{\n    \"template_name\": [{\n        \"text\": \"我的api测试模版\",\n        \"lang\": \"zh_CN\"\n    }],\n    \"template_content\": {\n        \"controls\": [{\n            \"property\": {\n                \"control\": \"Selector\",\n                \"id\": \"Selector-01\",\n                \"title\": [{\n                    \"text\": \"多选控件名称\",\n                    \"lang\": \"zh_CN\"\n                }],\n                \"placeholder\": [{\n                    \"text\": \"多选控件说明\",\n                    \"lang\": \"zh_CN\"\n                }],\n                \"require\": 0,\n                \"un_print\": 1\n            },\n            \"config\":{\n                \"selector\": {\n                \"type\": \"multi\",\n                \"options\": [\n                    {\n                        \"key\": \"option-1\", \n                        \"value\":{\n                            \"text\":\"选项1\",\n                            \"lang\":\"zh_CN\"\n                        }\n                    },\n                    {\n                        \"key\": \"option-2\",\n                        \"value\":{\n                            \"text\":\"选项2\",\n                            \"lang\":\"zh_CN\"\n                        }\n                    }\n                ]\n                }\n            }\n        },\n        {\n            \"property\": {\n                \"control\": \"Text\",\n                \"id\": \"Text-01\",\n                \"title\": [{\n                    \"text\": \"文本控件名称\",\n                    \"lang\": \"zh_CN\"\n                }],\n                \"placeholder\": [{\n                    \"text\": \"文本控件说明\",\n                    \"lang\": \"zh_CN\"\n                }],\n                \"require\": 0,\n                \"un_print\": 1\n            },\n            \"config\":{\n                \n            }\n        }]\n    }\n}",
        "request_example_json": {
          "template_name": [
            {
              "text": "我的api测试模版",
              "lang": "zh_CN"
            }
          ],
          "template_content": {
            "controls": [
              {
                "property": {
                  "control": "Selector",
                  "id": "Selector-01",
                  "title": [
                    {
                      "text": "多选控件名称",
                      "lang": "zh_CN"
                    }
                  ],
                  "placeholder": [
                    {
                      "text": "多选控件说明",
                      "lang": "zh_CN"
                    }
                  ],
                  "require": 0,
                  "un_print": 1
                },
                "config": {
                  "selector": {
                    "type": "multi",
                    "options": [
                      {
                        "key": "option-1",
                        "value": {
                          "text": "选项1",
                          "lang": "zh_CN"
                        }
                      },
                      {
                        "key": "option-2",
                        "value": {
                          "text": "选项2",
                          "lang": "zh_CN"
                        }
                      }
                    ]
                  }
                }
              },
              {
                "property": {
                  "control": "Text",
                  "id": "Text-01",
                  "title": [
                    {
                      "text": "文本控件名称",
                      "lang": "zh_CN"
                    }
                  ],
                  "placeholder": [
                    {
                      "text": "文本控件说明",
                      "lang": "zh_CN"
                    }
                  ],
                  "require": 0,
                  "un_print": 1
                },
                "config": {}
              }
            ]
          }
        },
        "response_example_text": "{\n    \"errcode\":0,\n    \"errmsg\":\"ok\",\n    \"template_id\":\"TEMPLATE_ID\"\n}",
        "response_example_json": {
          "errcode": 0,
          "errmsg": "ok",
          "template_id": "TEMPLATE_ID"
        },
        "permissions": [
          "注： 从2023年12月1日0点起，不再支持通过系统应用secret调用接口，存量企业暂不受影响 查看详情"
        ],
        "notes": [
          "1.第三方应用可以获取第三方应用添加的模板详情。\n2.自建应用的Secret可获取企业自建模板的模板详情。\n3.接口调用频率限制为600次/分钟。",
          "注意：\n1. 当模板的控件为必填属性时，表单中对应的控件必须有值。\n2. 一个模版中只能拥有一类假勤控件类型，Vacation-假期；Attendance-外出/出差/加班 均为假勤控件类型。",
          "注意：文本/多行文本控件中config不需要填写",
          "注意：数字控件中config不需要填写",
          "注意：金额控件中config不需要填写",
          "注意 ：纯文本+链接标题总长度不能超过 800个字符",
          "注意：请假控件中config不需要填写",
          "注意：收款账户控件中config不需要填写"
        ],
        "review_hints": [
          "Review doc.notes for conditional fields, limits, and permission caveats."
        ]
      }
    },
