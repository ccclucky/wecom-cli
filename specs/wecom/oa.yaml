    {
      "name": "approval_create_template",
      "cli_action": "approval-create-template",
      "summary": "创建审批模板",
      "method": "POST",
      "endpoint": "/cgi-bin/oa/approval/create_template",
      "args": [
        {
          "name": "template_name",
          "flag": "--template-name",
          "type": "str",
          "help": "模版名称数组",
          "required": true
        },
        {
          "name": "text",
          "flag": "--text",
          "type": "str",
          "help": "模版名称。需满足以下条件：1-模版名称不得和现有模版名称重复；2-长度不得超过40个字符。",
          "required": true
        },
        {
          "name": "lang",
          "flag": "--lang",
          "type": "str",
          "help": "显示语言，中文：zh_CN（注意不是zh-CN）",
          "required": true
        },
        {
          "name": "template_content",
          "flag": "--template-content",
          "type": "str",
          "help": "审批模版控件设置，由多个表单控件及其内容组成，其中包含需要对控件赋值的信息",
          "required": true
        },
        {
          "name": "controls",
          "flag": "--controls",
          "type": "str",
          "help": "控件数组，模版中可以设置多个控件类型，排列顺序和管理端展示的相同",
          "required": true
        },
        {
          "name": "property",
          "flag": "--property",
          "type": "str",
          "help": "控件的基础属性",
          "required": true
        },
        {
          "name": "control",
          "flag": "--control",
          "type": "str",
          "help": "控件类型：Text-文本；Textarea-多行文本；Number-数字；Money-金额；Date-日期/日期+时间；Selector-单选/多选；；Contact-成员/部门；Tips-说明文字；File-附件；Table-明细；Location-位置；RelatedApproval-关联审批单；DateRange-时长；PhoneNumber-电话号码；Vacation-假期；Attendance-外出/出差/加班；BankAccount-收款账户 。以上为目前可支持的控件类型",
          "required": true
        },
        {
          "name": "id",
          "flag": "--id",
          "type": "str",
          "help": "控件id。1-模版内控件id必须唯一；2-控件id格式：control-数字，如\"Text-01\"",
          "required": true
        },
        {
          "name": "title",
          "flag": "--title",
          "type": "str",
          "help": "控件名称",
          "required": true
        },
        {
          "name": "text_1",
          "flag": "--text-1",
          "type": "str",
          "help": "控件名称。需满足以下条件：1-控件名称不得和现有控件名称重复；2-长度不得超过40个字符。3-Attendance-外出/出差/加班控件title固定为外出/出差/加班，暂不支持自定义",
          "required": true
        },
        {
          "name": "lang_1",
          "flag": "--lang-1",
          "type": "str",
          "help": "显示语言，中文：zh_CN（注意不是zh-CN）",
          "required": true
        },
        {
          "name": "placeholder",
          "flag": "--placeholder",
          "type": "str",
          "help": "控件说明，假勤组件（Vacation、Attendance）暂不支持设置"
        },
        {
          "name": "text_2",
          "flag": "--text-2",
          "type": "str",
          "help": "控件说明。需满足以下条件：长度不得超过80个字符。"
        },
        {
          "name": "lang_2",
          "flag": "--lang-2",
          "type": "str",
          "help": "显示语言，中文：zh_CN（注意不是zh-CN）；若text填写，则该项为必填"
        },
        {
          "name": "require",
          "flag": "--require",
          "type": "bool",
          "help": "控件是否必填。0-非必填；1-必填；默认为0;假勤组件（Vacation、Attendance）不支持设置非必填"
        },
        {
          "name": "un_print",
          "flag": "--un-print",
          "type": "bool",
          "help": "控件是否可打印。0-可打印；1-不可打印；默认为0；假勤组件（Vacation、Attendance）不支持设置不可打印"
        },
        {
          "name": "config",
          "flag": "--config",
          "type": "str",
          "help": "控件配置。控件的类型不同，其中填的参数不相同，下方将为每一个控件配置进行详细说明"
        }
      ],
      "request": {
        "json_body": {
          "template_name": {
            "from_arg": "template_name"
          },
          "text": {
            "from_arg": "text"
          },
          "lang": {
            "from_arg": "lang"
          },
          "template_content": {
            "from_arg": "template_content"
          },
          "controls": {
            "from_arg": "controls"
          },
          "property": {
            "from_arg": "property"
          },
          "control": {
            "from_arg": "control"
          },
          "id": {
            "from_arg": "id"
          },
          "title": {
            "from_arg": "title"
          },
          "text_1": {
            "from_arg": "text_1"
          },
          "lang_1": {
