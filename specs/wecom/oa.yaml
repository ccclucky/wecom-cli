        ],
        "request_example_text": "{\n\t\"creator_userid\": \"WangXiaoMing\",\n\t\"template_id\": \"3Tka1eD6v6JfzhDMqPd3aMkFdxqtJMc2ZRioeFXkaaa\",\n\t\"use_template_approver\": 0,\n\t\"choose_department\": 2,\n\t\"process\": {\n\t\t\"node_list\": [{\n\t\t\t\t\"type\": 1,\n\t\t\t\t\"apv_rel\": 1,\n\t\t\t\t\"userid\": [\n\t\t\t\t\t\"abc\",\n\t\t\t\t\t\"bcd\"\n\t\t\t\t]\n\t\t\t},\n\t\t\t{\n\t\t\t\t\"type\": 1,\n\t\t\t\t\"apv_rel\": 1,\n\t\t\t\t\"userid\": [\n\t\t\t\t\t\"abc\"\n\t\t\t\t]\n\t\t\t}\n\t\t]\n\t},\n\t\"apply_data\": {\n\t\t\"contents\": [{\n\t\t\t\"control\": \"Text\",\n\t\t\t\"id\": \"Text-15111111111\",\n\t\t\t\"value\": {\n\t\t\t\t\"text\": \"文本填写的内容\"\n\t\t\t}\n\t\t}]\n\t},\n\t\"summary_list\": [{\n\t\t\t\"summary_info\": [{\n\t\t\t\t\"text\": \"摘要第1行\",\n\t\t\t\t\"lang\": \"zh_CN\"\n\t\t\t}]\n\t\t},\n\t\t{\n\t\t\t\"summary_info\": [{\n\t\t\t\t\"text\": \"摘要第2行\",\n\t\t\t\t\"lang\": \"zh_CN\"\n\t\t\t}]\n\t\t},\n\t\t{\n\t\t\t\"summary_info\": [{\n\t\t\t\t\"text\": \"摘要第3行\",\n\t\t\t\t\"lang\": \"zh_CN\"\n\t\t\t}]\n\t\t}\n\t]\n}",
