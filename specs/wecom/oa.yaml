{
  "domain": "oa",
  "operations": [
    {
      "name": "applyevent",
      "cli_action": "applyevent",
      "summary": "提交审批申请",
      "method": "POST",
      "endpoint": "/cgi-bin/oa/applyevent",
      "args": [
        {
          "name": "creator_userid",
          "flag": "--creator-userid",
          "type": "str",
          "help": "申请人userid，此审批申请将以此员工身份提交，申请人需在应用可见范围内",
          "required": true
        },
        {
          "name": "template_id",
          "flag": "--template-id",
          "type": "str",
          "help": "模板id。可在“获取审批申请详情”、“审批状态变化回调通知”中获得，也可在审批模板的模板编辑页面链接中获得。暂不支持通过接口提交[打卡补卡][调班]模板审批单。",
          "required": true
        },
        {
          "name": "use_template_approver",
          "flag": "--use-template-approver",
          "type": "str",
          "help": "审批人模式：0-通过接口指定审批人、抄送人（此时process参数必填）; 1-使用此模板在管理后台设置的审批流程(需要保证审批流程中没有“申请人自选”节点)，支持条件审批。默认为0",
          "required": true
        },
        {
          "name": "choose_department",
          "flag": "--choose-department",
          "type": "str",
          "help": "提单者提单部门id，不填默认为主部门"
        },
        {
          "name": "apply_data",
          "flag": "--apply-data",
          "type": "str",
          "help": "审批申请数据，可定义审批申请中各个控件的值，其中必填项必须有值，选填项可为空，数据结构同“获取审批申请详情”接口返回值中同名参数“apply_data”",
          "required": true
        },
        {
          "name": "contents",
          "flag": "--contents",
          "type": "str",
          "help": "审批申请详情，由多个表单控件及其内容组成，其中包含需要对控件赋值的信息",
          "required": true
        },
        {
          "name": "control",
          "flag": "--control",
          "type": "str",
          "help": "控件类型：Text-文本；Textarea-多行文本；Number-数字；Money-金额；Date-日期/日期+时间；Selector-单选/多选；；Contact-成员/部门；Tips-说明文字；File-附件；Table-明细；Location-位置；RelatedApproval-关联审批单；Formula-公式；DateRange-时长；",
          "required": true
        },
        {
          "name": "id",
          "flag": "--id",
          "type": "str",
          "help": "控件id：控件的唯一id，可通过“获取审批模板详情”接口获取",
          "required": true
        },
        {
          "name": "value",
          "flag": "--value",
          "type": "str",
          "help": "控件值 ，需在此为申请人在各个控件中填写内容不同控件有不同的赋值参数，具体说明详见附录。模板配置的控件属性为必填时，对应value值需要有值。",
          "required": true
        },
        {
          "name": "summary_list",
          "flag": "--summary-list",
          "type": "str",
          "help": "摘要信息，用于显示在审批通知卡片、审批列表的摘要信息，最多3行",
          "required": true
        },
        {
          "name": "summary_info",
          "flag": "--summary-info",
          "type": "str",
          "help": "摘要行信息，用于定义某一行摘要显示的内容",
          "required": true
        },
        {
          "name": "text",
          "flag": "--text",
          "type": "str",
          "help": "摘要行显示文字，用于记录列表和消息通知的显示，不要超过20个字符",
          "required": true
        },
        {
          "name": "lang",
          "flag": "--lang",
          "type": "str",
          "help": "摘要行显示语言，中文：zh_CN（注意不是zh-CN），英文：en。",
          "required": true
        },
        {
          "name": "process",
          "flag": "--process",
          "type": "str",
          "help": "新版流程列表"
        },
        {
          "name": "node_list",
          "flag": "--node-list",
          "type": "str",
          "help": "流程节点",
          "required": true
        },
        {
          "name": "type",
          "flag": "--type",
          "type": "str",
          "help": "节点类型 1:审批人 2:抄送人 3:办理人",
          "required": true
        },
        {
          "name": "apv_rel",
          "flag": "--apv-rel",
          "type": "str",
          "help": "多人审批方式 1-会签；2-或签 3-依次审批"
        },
        {
          "name": "userid",
          "flag": "--userid",
          "type": "str",
          "help": "用户id",
          "required": true
        }
      ],
      "request": {
        "json_body": {
          "creator_userid": {
            "from_arg": "creator_userid"
          },
          "template_id": {
            "from_arg": "template_id"
          },
          "use_template_approver": {
            "from_arg": "use_template_approver"
          },
          "choose_department": {
            "from_arg": "choose_department"
          },
          "apply_data": {
            "from_arg": "apply_data"
          },
          "contents": {
            "from_arg": "contents"
          },
          "control": {
            "from_arg": "control"
          },
          "id": {
            "from_arg": "id"
          },
          "value": {
            "from_arg": "value"
          },
          "summary_list": {
            "from_arg": "summary_list"
          },
          "summary_info": {
            "from_arg": "summary_info"
          },
          "text": {
            "from_arg": "text"
          },
          "lang": {
            "from_arg": "lang"
          },
          "process": {
            "from_arg": "process"
          },
          "node_list": {
            "from_arg": "node_list"
          },
          "type": {
            "from_arg": "type"
          },
          "apv_rel": {
            "from_arg": "apv_rel"
          },
          "userid": {
            "from_arg": "userid"
          }
        }
      },
      "examples": [
        "wecom oa applyevent --creator-userid <creator_userid> --template-id <template_id> --use-template-approver <use_template_approver> [--choose-department <choose_department>] --apply-data <apply_data> --contents <contents> --control <control> --id <id> --value <value> --summary-list <summary_list> --summary-info <summary_info> --text <text> --lang <lang> [--process <process>] --node-list <node_list> --type <type> [--apv-rel <apv_rel>] --userid <userid>"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "错误码，详情见错误码说明"
            },
            "errmsg": {
              "type": "string",
              "description": "错误码对应的错误信息提示"
            },
            "sp_no": {
              "type": "string",
              "description": "表单提交成功后，返回的表单编号"
            }
          },
          "required": [
            "errcode",
            "errmsg",
            "sp_no"
          ]
        }
      },
      "doc": {
