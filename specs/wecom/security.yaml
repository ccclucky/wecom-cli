        ],
        "request_example_text": "{\n    \"start_time\": 1724256000,\n    \"end_time\": 1724860799,\n    \"oper_type\": 1,\n    \"userid\": \"sam\",\n    \"cursor\": \"xxxxx\",\n    \"limit\": 2\n}",
        "request_example_json": {
