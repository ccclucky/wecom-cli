{
  "domain": "security",
  "operations": [
    {
      "name": "admin_oper_log_list",
      "cli_action": "admin-oper-log-list",
      "summary": "获取管理端操作日志",
      "method": "POST",
      "endpoint": "/cgi-bin/security/admin_oper_log/list",
      "args": [
        {
          "name": "start_time",
          "flag": "--start-time",
          "type": "str",
          "help": "开始时间 取值范围：不早于180天前",
          "required": true
        },
        {
          "name": "end_time",
          "flag": "--end-time",
          "type": "str",
          "help": "结束时间 取值范围：大于start_time，小于当前时间。开始时间和结束时间之间的跨度不能超过7天。",
          "required": true
        },
        {
          "name": "oper_type",
          "flag": "--oper-type",
          "type": "str",
          "help": "操作类型。不填表示全部 取值范围目前支持如下： 2 - 权限管理变更 3 - 成员与部门变更 7 - 其它 8 - 应用变更 11 - 通讯录与聊天管理 12 - 企业信息管理 13 - 外部联系人管理"
        },
        {
          "name": "userid",
          "flag": "--userid",
          "type": "str",
          "help": "操作者userid"
        },
        {
          "name": "cusor",
          "flag": "--cusor",
          "type": "str",
          "help": "分页游标。不填表示首页"
        },
        {
          "name": "limit",
          "flag": "--limit",
          "type": "int",
          "help": "最大记录数。不填默认最多获取400个记录 取值范围：1 ~ 400 注意：不保证每次返回的数据刚好为指定limit ，必须用返回的 has_more 判断是否继续请求"
        }
      ],
      "request": {
        "json_body": {
          "start_time": {
            "from_arg": "start_time"
          },
          "end_time": {
            "from_arg": "end_time"
          },
          "oper_type": {
            "from_arg": "oper_type"
          },
          "userid": {
            "from_arg": "userid"
          },
          "cusor": {
            "from_arg": "cusor"
          },
          "limit": {
            "from_arg": "limit"
          }
        }
      },
      "examples": [
        "wecom security admin-oper-log-list --start-time <start_time> --end-time <end_time> [--oper-type <oper_type>] [--userid <userid>] [--cusor <cusor>] [--limit <limit>]"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "返回码"
            },
            "errmsg": {
              "type": "string",
              "description": "错误码描述"
            },
            "has_more": {
              "type": "boolean",
              "description": "是否还有下一页"
            },
            "next_cursor": {
              "type": "string",
              "description": "下一页的分页游标。不同过滤条件的的cursor不能混用"
            },
            "record_list": {
              "type": "array",
              "items": {
                "type": "object",
                "properties": {
                  "time": {
                    "type": "integer"
                  },
                  "userid": {
                    "type": "string"
                  },
                  "oper_type": {
                    "type": "integer"
                  },
                  "detail_type": {
                    "type": "integer"
                  },
                  "detail_info": {
                    "type": "string"
                  },
                  "ip": {
                    "type": "string"
                  }
                },
                "required": [
                  "time",
                  "userid",
                  "oper_type",
                  "detail_type",
                  "detail_info",
                  "ip"
                ]
              },
              "description": "记录列表"
            }
          },
          "required": [
            "errcode",
            "errmsg",
            "has_more",
            "next_cursor",
            "record_list"
          ]
        }
      },
      "doc": {
