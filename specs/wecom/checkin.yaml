            "type": null
          },
          {
            "name": "wifimac",
            "required": false,
            "description": "打卡的MAC地址/bssid 满足正则表达式^[A-Fa-f0-9]{2}:[A-Fa-f0-9]{2}:[A-Fa-f0-9]{2}:[A-Fa-f0-9]{2}:[A-Fa-f0-9]{2}:[A-Fa-f0-9]{2}$。传入wifiname时必填",
            "type": null
          },
          {
            "name": "mediaids",
            "required": false,
            "description": "打卡的附件media_id，可使用media/upload上传附件。当前最多只允许传1个",
            "type": null
          },
          {
            "name": "lat",
            "required": false,
            "description": "位置打卡地点纬度，是实际纬度的1000000倍，与腾讯地图一致采用GCJ-02坐标系统标准 范围 -90000000,90000000",
            "type": null
          },
          {
            "name": "lng",
            "required": false,
            "description": "位置打卡地点经度，是实际经度的1000000倍，与腾讯地图一致采用GCJ-02坐标系统标准 范围-180000000,180000000",
            "type": null
          },
          {
            "name": "device_type",
            "required": true,
            "description": "打卡设备类型：1、门禁 2、考勤机（人脸识别、指纹识别） 3、其他；",
            "type": null
          },
          {
            "name": "device_detail",
            "required": true,
            "description": "打卡设备品牌：字符串写入（限制40个字符内）",
            "type": null
          }
        ],
        "response_params": [
          {
            "name": "errcode",
            "required": null,
            "description": "返回码",
            "type": "int32"
          },
          {
            "name": "errmsg",
            "required": null,
            "description": "错误码描述",
            "type": "string"
          }
        ],
        "request_example_text": "{\n    \"records\": [\n        {\n            \"userid\": \"userId\",\n            \"checkin_time\": 1705899000,\n            \"location_title\": \"1234\",\n            \"location_detail\": \"1234\",\n            \"mediaids\": [\n                \"mediaId\"\n            ],\n            \"notes\": \"\",\n            \"device_type\": 1,\n            \"lat\": 22234233,\n            \"lng\": 1233123,\n            \"device_detail\": \"device_detail_test\",\n            \"wifiname\": \"Tencent-WiFi\",\n            \"wifimac\": \"a2:8b:7f:c0:27:4b\"\n        }\n    ]\n}",
        "request_example_json": {
          "records": [
            {
              "userid": "userId",
              "checkin_time": 1705899000,
              "location_title": "1234",
              "location_detail": "1234",
              "mediaids": [
                "mediaId"
              ],
              "notes": "",
              "device_type": 1,
              "lat": 22234233,
              "lng": 1233123,
