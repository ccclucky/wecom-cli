{
  "domain": "checkin",
  "operations": [
    {
      "name": "add_checkin_record",
      "cli_action": "add-checkin-record",
      "summary": "添加打卡记录",
      "method": "POST",
      "endpoint": "/cgi-bin/checkin/add_checkin_record",
      "args": [
        {
          "name": "records",
          "flag": "--records",
          "type": "str",
          "help": "打卡记录，一批最多200个",
          "required": true
        },
        {
          "name": "userid",
          "flag": "--userid",
          "type": "str",
          "help": "用户id",
          "required": true
        },
        {
          "name": "checkin_time",
          "flag": "--checkin-time",
          "type": "str",
          "help": "打卡时间。Unix时间戳",
          "required": true
        },
        {
          "name": "location_title",
          "flag": "--location-title",
          "type": "str",
          "help": "打卡地点title，限制1024字符",
          "required": true
        },
        {
          "name": "location_detail",
          "flag": "--location-detail",
          "type": "str",
          "help": "打卡地点详情限制1024字符",
          "required": true
        },
        {
          "name": "notes",
          "flag": "--notes",
          "type": "str",
          "help": "打卡备注限制1024字符"
        },
        {
          "name": "wifiname",
          "flag": "--wifiname",
          "type": "str",
          "help": "打卡wifi名称限制1024字符"
        },
        {
          "name": "wifimac",
          "flag": "--wifimac",
          "type": "str",
          "help": "打卡的MAC地址/bssid 满足正则表达式^[A-Fa-f0-9]{2}:[A-Fa-f0-9]{2}:[A-Fa-f0-9]{2}:[A-Fa-f0-9]{2}:[A-Fa-f0-9]{2}:[A-Fa-f0-9]{2}$。传入wifiname时必填"
        },
        {
          "name": "mediaids",
          "flag": "--mediaids",
          "type": "str",
          "help": "打卡的附件media_id，可使用media/upload上传附件。当前最多只允许传1个"
        },
        {
          "name": "lat",
          "flag": "--lat",
          "type": "str",
          "help": "位置打卡地点纬度，是实际纬度的1000000倍，与腾讯地图一致采用GCJ-02坐标系统标准 范围 -90000000,90000000"
        },
        {
          "name": "lng",
          "flag": "--lng",
          "type": "str",
          "help": "位置打卡地点经度，是实际经度的1000000倍，与腾讯地图一致采用GCJ-02坐标系统标准 范围-180000000,180000000"
        },
        {
          "name": "device_type",
          "flag": "--device-type",
          "type": "str",
          "help": "打卡设备类型：1、门禁 2、考勤机（人脸识别、指纹识别） 3、其他；",
          "required": true
        },
        {
          "name": "device_detail",
          "flag": "--device-detail",
          "type": "str",
          "help": "打卡设备品牌：字符串写入（限制40个字符内）",
          "required": true
        }
      ],
      "request": {
        "json_body": {
          "records": {
            "from_arg": "records"
          },
          "userid": {
            "from_arg": "userid"
          },
          "checkin_time": {
            "from_arg": "checkin_time"
          },
          "location_title": {
            "from_arg": "location_title"
          },
          "location_detail": {
            "from_arg": "location_detail"
          },
          "notes": {
            "from_arg": "notes"
          },
          "wifiname": {
            "from_arg": "wifiname"
          },
          "wifimac": {
            "from_arg": "wifimac"
          },
          "mediaids": {
            "from_arg": "mediaids"
          },
          "lat": {
            "from_arg": "lat"
          },
          "lng": {
            "from_arg": "lng"
          },
          "device_type": {
            "from_arg": "device_type"
          },
          "device_detail": {
            "from_arg": "device_detail"
          }
        }
      },
      "examples": [
        "wecom checkin add-checkin-record --records <records> --userid <userid> --checkin-time <checkin_time> --location-title <location_title> --location-detail <location_detail> [--notes <notes>] [--wifiname <wifiname>] [--wifimac <wifimac>] [--mediaids <mediaids>] [--lat <lat>] [--lng <lng>] --device-type <device_type> --device-detail <device_detail>"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "返回码"
            },
            "errmsg": {
              "type": "string",
              "description": "错误码描述"
            }
          },
          "required": [
            "errcode",
            "errmsg"
          ]
        }
      },
      "doc": {
        "title": "添加打卡记录",
        "source_url": "https://developer.work.weixin.qq.com/document/path/99647",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/checkin/add_checkin_record?access_token=ACCESS_TOKEN",
        "request_params": [
          {
