          {
            "name": "records",
            "required": true,
            "description": "打卡记录，一批最多200个",
            "type": null
          },
          {
            "name": "userid",
            "required": true,
            "description": "用户id",
            "type": null
          },
          {
            "name": "checkin_time",
            "required": true,
            "description": "打卡时间。Unix时间戳",
            "type": null
          },
          {
            "name": "location_title",
            "required": true,
            "description": "打卡地点title，限制1024字符",
            "type": null
          },
          {
            "name": "location_detail",
            "required": true,
            "description": "打卡地点详情限制1024字符",
            "type": null
          },
          {
            "name": "notes",
