          "errmsg": "ok"
        },
        "permissions": [
          "注： 从2023年12月1日0点起，不再支持通过系统应用secret调用接口，存量企业暂不受影响 查看详情",
          "调用频率:\n接口调用频率限制为60次/分钟。"
        ]
      }
    },
    {
      "name": "punch_correction",
      "cli_action": "punch-correction",
      "summary": "为打卡人员补卡",
      "method": "POST",
      "endpoint": "/cgi-bin/checkin/punch_correction",
      "args": [
        {
          "name": "userid",
          "flag": "--userid",
          "type": "str",
          "help": "需要补卡的成员userid",
          "required": true
        },
        {
          "name": "schedule_date_time",
          "flag": "--schedule-date-time",
          "type": "str",
          "help": "应打卡日期，为当天0点的Unix时间戳。",
          "required": true
        },
        {
          "name": "schedule_checkin_time",
          "flag": "--schedule-checkin-time",
          "type": "str",
          "help": "应打卡时间点，相对应打卡日期0点的偏移秒数，如9点整则为32400。可通过获取员工打卡规则获取对应的规则打卡时间点，如work_sec/off_work_sec。 对于没有规则对应的打卡时间点，如休息日打卡、无规则打卡、自由上下班，该参数不用填。"
        },
        {
          "name": "checkin_time",
          "flag": "--checkin-time",
          "type": "str",
          "help": "实际打卡时间，Unix时间戳。相对于schedule_checkin_time的实际打卡时间，具体可以表现为正常/迟到/早退",
          "required": true
        },
        {
          "name": "remark",
          "flag": "--remark",
          "type": "str",
          "help": "备注信息 不超过512字节"
        }
      ],
      "request": {
        "json_body": {
          "userid": {
            "from_arg": "userid"
          },
          "schedule_date_time": {
            "from_arg": "schedule_date_time"
          },
          "schedule_checkin_time": {
            "from_arg": "schedule_checkin_time"
          },
          "checkin_time": {
            "from_arg": "checkin_time"
          },
          "remark": {
            "from_arg": "remark"
          }
        }
      },
      "examples": [
        "wecom checkin punch-correction --userid <userid> --schedule-date-time <schedule_date_time> [--schedule-checkin-time <schedule_checkin_time>] --checkin-time <checkin_time> [--remark <remark>]"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "返回码"
            },
            "errmsg": {
              "type": "string",
              "description": "错误码描述"
            }
          },
          "required": [
            "errcode",
            "errmsg"
          ]
        }
      },
      "doc": {
        "title": "为打卡人员补卡",
        "source_url": "https://developer.work.weixin.qq.com/document/path/95803",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/checkin/punch_correction?access_token=ACCESS_TOKEN",
        "request_params": [
          {
            "name": "access_token",
            "required": true,
            "description": "调用接口凭证",
            "type": "string"
          },
          {
            "name": "userid",
            "required": true,
            "description": "需要补卡的成员userid",
            "type": "string"
          },
          {
            "name": "schedule_date_time",
            "required": true,
            "description": "应打卡日期，为当天0点的Unix时间戳。",
            "type": "uint32"
          },
          {
            "name": "schedule_checkin_time",
            "required": false,
            "description": "应打卡时间点，相对应打卡日期0点的偏移秒数，如9点整则为32400。可通过获取员工打卡规则获取对应的规则打卡时间点，如work_sec/off_work_sec。 对于没有规则对应的打卡时间点，如休息日打卡、无规则打卡、自由上下班，该参数不用填。",
            "type": "uint32"
          },
          {
            "name": "checkin_time",
            "required": true,
            "description": "实际打卡时间，Unix时间戳。相对于schedule_checkin_time的实际打卡时间，具体可以表现为正常/迟到/早退",
            "type": "uint32"
          },
          {
            "name": "remark",
            "required": false,
            "description": "备注信息 不超过512字节",
            "type": "string"
          }
        ],
        "response_params": [
          {
            "name": "errcode",
            "required": null,
            "description": "返回码",
            "type": "int32"
          },
          {
            "name": "errmsg",
            "required": null,
            "description": "错误码描述",
            "type": "string"
          }
        ],
        "request_example_text": "{\n   \"userid\": \"zhangsan\",\n   \"schedule_date_time\": 1654444800,\n   \"schedule_checkin_time\": 32400,\n   \"checkin_time\": 1654486827,\n   \"remark\": \"备注信息\"\n}",
        "request_example_json": {
          "userid": "zhangsan",
          "schedule_date_time": 1654444800,
          "schedule_checkin_time": 32400,
          "checkin_time": 1654486827,
          "remark": "备注信息"
        },
        "response_example_text": "{\n    \"errcode\": 0,\n    \"errmsg\": \"ok\"\n}",
        "response_example_json": {
          "errcode": 0,
          "errmsg": "ok"
        },
        "permissions": [
          "注： 从2023年12月1日0点起，不再支持通过系统应用secret调用接口，存量企业暂不受影响 查看详情",
          "调用频率:\n接口调用频率限制为600次/分钟"
        ]
      }
    }
