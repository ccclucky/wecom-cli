        "request_example_text": "{\n\t\"userid\":\"xxxxx\",\n\t\"update_items\":[\n\t\t{\n\t\t\t\"fieldid\":11020,\n\t\t\t\"sub_idx\":0,\n\t\t\t\"value_string\":\"xxxxx\"\n\t\t},\n\t\t{\n\t\t\t\"fieldid\":17003,\n\t\t\t\"sub_idx\":1,\n\t\t\t\"value_mobile\":{\n\t\t\t\t\"value_mobile_country_code\":\"xxx\",\n\t\t\t\t\"value_mobile\":\"xxxxxxxx\"\n\t\t\t}\n\t\t}\n\t],\n\t\"remove_items\":[\n\t\t{\n\t\t\t\"group_type\":1,\n\t\t\t\"sub_idx\":1\n\t\t},\n\t\t{\n\t\t\t\"group_type\":1,\n\t\t\t\"sub_idx\":2\n\t\t}\n\t],\n\t\"insert_items\":[\n\t\t{\n\t\t\t\"group_type\":4,\n\t\t\t\"item\":[\n\t\t\t\t{\n\t\t\t\t\t\"fieldid\":17001,\n\t\t\t\t\t\"sub_idx\":0,\n\t\t\t\t\t\"value_string\":\"孙悟空\"\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"fieldid\":17002,\n\t\t\t\t\t\"sub_idx\":0,\n\t\t\t\t\t\"value_uint32\":1\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"fieldid\":17003,\n\t\t\t\t\t\"sub_idx\":0,\n\t\t\t\t\t\"value_mobile\":{\n\t\t\t\t\t\t\"value_country_code\":\"xxx\",\n\t\t\t\t\t\t\"value_mobile\":\"xxxxxxxx\"\n\t\t\t\t\t}\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"fieldid\":17004,\n\t\t\t\t\t\"sub_idx\":0,\n\t\t\t\t\t\"value_string\":\"娜美克星\"\n\t\t\t\t}\n\t\t\t]\n\t\t}\n\t]\n}",
