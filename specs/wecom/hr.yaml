    {
      "name": "get_staff_info",
      "cli_action": "get-staff-info",
      "summary": "获取员工花名册信息",
      "method": "POST",
      "endpoint": "/cgi-bin/hr/get_staff_info",
      "args": [
        {
          "name": "userid",
          "flag": "--userid",
          "type": "str",
          "help": "需要获取花名册信息的员工的userid 该员工需要在调用应用的可见范围内，否则将返回错误码",
          "required": true
        },
        {
          "name": "get_all",
          "flag": "--get-all",
          "type": "bool",
          "help": "是否获取全部字段信息，不填时默认为否"
        },
        {
          "name": "fieldids",
          "flag": "--fieldids",
          "type": "str",
          "help": "需要获取的字段信息。 参数get_all为否或不填时，此字段不能为空； 参数get_all为是时，此字段填写的内容将被忽略"
        },
        {
          "name": "fieldids_fieldid",
          "flag": "--fieldids-fieldid",
          "type": "str",
          "help": "需要获取的字段id",
          "required": true
        },
        {
          "name": "fieldids_sub_idx",
          "flag": "--fieldids-sub-idx",
          "type": "str",
          "help": "需要获取的字段下标。 当需要获取的字段属于可重复的组(参考可重复字段组列表)时，需要指定获取组内第几组数据的字段信息，当需要获取的字段不属于可重复的组时，需要为0。 不填时默认为0"
        }
      ],
      "request": {
        "json_body": {
          "userid": {
            "from_arg": "userid"
          },
          "get_all": {
            "from_arg": "get_all"
          },
          "fieldids": {
            "from_arg": "fieldids"
          },
          "fieldids_fieldid": {
            "from_arg": "fieldids_fieldid"
          },
          "fieldids_sub_idx": {
            "from_arg": "fieldids_sub_idx"
          }
        }
      },
      "examples": [
        "wecom hr get-staff-info --userid <userid> [--get-all <get_all>] [--fieldids <fieldids>] --fieldids-fieldid <fieldids_fieldid> [--fieldids-sub-idx <fieldids_sub_idx>]"
      ],
      "doc": {
        "title": "获取员工花名册信息",
        "source_url": "https://developer.work.weixin.qq.com/document/path/99132",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/hr/get_staff_info?access_token=ACCESS_TOKEN",
        "request_params": [
          {
            "name": "access_token",
            "required": true,
            "description": "调用接口凭证",
            "type": null
          },
          {
            "name": "userid",
            "required": true,
            "description": "需要获取花名册信息的员工的userid 该员工需要在调用应用的可见范围内，否则将返回错误码",
            "type": null
          },
          {
            "name": "get_all",
            "required": false,
            "description": "是否获取全部字段信息，不填时默认为否",
            "type": null
          },
          {
            "name": "fieldids",
            "required": false,
            "description": "需要获取的字段信息。 参数get_all为否或不填时，此字段不能为空； 参数get_all为是时，此字段填写的内容将被忽略",
            "type": null
          },
          {
            "name": "fieldids_fieldid",
            "required": true,
            "description": "需要获取的字段id",
            "type": null
          },
          {
            "name": "fieldids_sub_idx",
            "required": false,
            "description": "需要获取的字段下标。 当需要获取的字段属于可重复的组(参考可重复字段组列表)时，需要指定获取组内第几组数据的字段信息，当需要获取的字段不属于可重复的组时，需要为0。 不填时默认为0",
            "type": null
          }
        ],
        "request_example_text": "{\n\t\"userid\":\"xxxxx\",\n\t\"get_all\":false,\n\t\"fieldids\":[\n\t\t{\n\t\t\t\"fieldid\":11004,\n\t\t\t\"sub_idx\":0\n\t\t},\n\t\t{\n\t\t\t\"fieldid\":14001,\n\t\t\t\"sud_idx\":1\n\t\t}\n\t]\n}",
        "request_example_json": {
          "userid": "xxxxx",
          "get_all": false,
          "fieldids": [
            {
              "fieldid": 11004,
              "sub_idx": 0
            },
            {
              "fieldid": 14001,
              "sud_idx": 1
            }
          ]
        },
        "notes": [
          "通过这个接口获取指定员工的花名册信息\n调用参数中的字段id信息可以通过获取员工字段配置接口获取"
        ],
        "review_hints": [
          "Review doc.notes for conditional fields, limits, and permission caveats."
        ]
      }
    },
    {
