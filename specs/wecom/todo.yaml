    {
      "name": "update",
      "cli_action": "update",
      "summary": "更新待办状态",
      "method": "POST",
      "endpoint": "/cgi-bin/todo/update",
      "args": [
        {
          "name": "todo_id",
          "flag": "--todo-id",
          "type": "str",
          "help": "待办ID",
          "required": true
        },
        {
          "name": "status",
          "flag": "--status",
          "type": "str",
          "help": "待办整体状态。 0 - 完成 1 - 进行中"
        },
        {
          "name": "attendees",
          "flag": "--attendees",
          "type": "str",
          "help": "待办参与人列表，最多支持20个参与人。可不传或传空数组；不传或为空时不修改参与人列表"
        },
        {
          "name": "attendees_userid",
          "flag": "--attendees-userid",
          "type": "str",
          "help": "待办参与人ID。当传入attendees时，该字段必填",
          "required": true
        },
        {
          "name": "attendees_status",
          "flag": "--attendees-status",
          "type": "str",
          "help": "参与人的待办状态。当传入attendees时，该字段必填。0 - 完成 1 - 进行中",
          "required": true
        }
      ],
      "request": {
        "json_body": {
          "todo_id": {
            "from_arg": "todo_id"
          },
          "status": {
            "from_arg": "status"
          },
          "attendees": {
            "from_arg": "attendees"
          },
          "attendees_userid": {
            "from_arg": "attendees_userid"
          },
          "attendees_status": {
            "from_arg": "attendees_status"
          }
        }
      },
      "examples": [
        "wecom todo update --todo-id <todo_id> [--status <status>] [--attendees <attendees>] --attendees-userid <attendees_userid> --attendees-status <attendees_status>"
      ],
