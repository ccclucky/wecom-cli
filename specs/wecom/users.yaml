          "required": true
        },
        {
          "name": "name",
          "flag": "--name",
          "type": "str",
          "help": "成员名称。长度为1~64个utf8字符",
          "required": true
        },
        {
          "name": "alias",
          "flag": "--alias",
          "type": "str",
          "help": "成员别名。长度1~64个utf8字符"
        },
        {
          "name": "mobile",
          "flag": "--mobile",
          "type": "str",
          "help": "手机号码。企业内必须唯一，mobile/email二者不能同时为空 ，中国大陆手机号码可省略“+86”，其他国家或地区必须要带上国际码。"
        },
        {
          "name": "department",
          "flag": "--department",
          "type": "json",
