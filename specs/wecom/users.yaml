    {
      "name": "get",
      "cli_action": "get",
      "summary": "读取成员",
      "method": "GET",
      "endpoint": "/cgi-bin/user/get",
      "args": [
        {
          "name": "userid",
          "flag": "--userid",
          "type": "str",
          "help": "成员UserID。对应管理端的账号，企业内必须唯一。不区分大小写，长度为1~64个字节",
          "required": true
        }
      ],
      "request": {
        "query": {
          "userid": {
            "from_arg": "userid"
          }
        }
      },
      "examples": [
        "wecom users get --userid zhangsan"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "返回码"
            },
            "errmsg": {
              "type": "string",
              "description": "对返回码的文本描述内容"
            },
            "userid": {
              "type": "string",
              "description": "成员UserID。对应管理端的账号，企业内必须唯一。不区分大小写，长度为1~64个字节；第三方应用返回的值为open_userid"
            },
            "name": {
              "type": "string",
              "description": "成员名称；第三方不可获取，调用时返回userid以代替name；代开发自建应用需要管理员授权才返回；对于非第三方创建的成员，第三方通讯录应用也不可获取；未返回name的情况需要通过通讯录展示组件来展示名字"
            },
            "department": {
              "type": "array",
              "items": {
                "type": "integer"
              },
              "description": "成员所属部门id列表，仅返回该应用有查看权限的部门id；成员授权模式下，固定返回根部门id，即固定为1。对授权了“组织架构信息”权限的第三方应用或授权了“组织架构信息”-“部门及父部门ID、部门负责人”权限的代开发应用，返回成员所属的全部部门id"
            },
            "order": {
              "type": "array",
              "items": {
                "type": "integer"
              },
              "description": "部门内的排序值，默认为0。数量必须和department一致，数值越大排序越前面。值范围是[0, 2^32)。成员授权模式下不返回该字段"
            },
            "position": {
              "type": "string",
              "description": "职务信息；代开发自建应用需要管理员授权才返回；第三方仅通讯录应用可获取；对于非第三方创建的成员，第三方通讯录应用也不可获取；上游企业不可获取下游企业成员该字段"
            },
            "mobile": {
              "type": "string",
              "description": "手机号码，代开发自建应用需要管理员授权且成员oauth2授权获取；第三方仅通讯录应用可获取；对于非第三方创建的成员，第三方通讯录应用也不可获取；上游企业不可获取下游企业成员该字段"
            },
            "gender": {
              "type": "string",
              "description": "性别。0表示未定义，1表示男性，2表示女性。代开发自建应用需要管理员授权且成员oauth2授权获取；第三方仅通讯录应用可获取；对于非第三方创建的成员，第三方通讯录应用也不可获取；上游企业不可获取下游企业成员该字段。注：不可获取指返回值0"
            },
            "email": {
              "type": "string",
              "description": "邮箱，代开发自建应用需要管理员授权且成员oauth2授权获取；第三方仅通讯录应用可获取；对于非第三方创建的成员，第三方通讯录应用也不可获取；上游企业不可获取下游企业成员该字段"
            },
            "biz_mail": {
              "type": "string",
              "description": "企业邮箱，代开发自建应用需要管理员授权且成员oauth2授权获取；第三方仅通讯录应用可获取；对于非第三方创建的成员，第三方通讯录应用也不可获取；上游企业不可获取下游企业成员该字段"
            },
            "is_leader_in_dept": {
              "type": "array",
              "items": {
                "type": "integer"
              },
              "description": "表示在所在的部门内是否为部门负责人，数量与department一致；第三方通讯录应用或者授权了“组织架构信息-应用可获取企业的部门组织架构信息-部门负责人”权限的第三方应用和代开发应用可获取；对于非第三方创建的成员，第三方通讯录应用不可获取；上游企业不可获取下游企业成员该字段"
            },
            "direct_leader": {
              "type": "array",
              "items": {
                "type": "string"
              },
              "description": "直属上级UserID，返回在应用可见范围内的直属上级列表，最多有1个直属上级；第三方通讯录应用或者授权了“组织架构信息-应用可获取可见范围内成员组织架构信息-直属上级”权限的第三方应用和代开发应用可获取；对于非第三方创建的成员，第三方通讯录应用不可获取；上游企业不可获取下游企业成员该字段"
            },
            "avatar": {
              "type": "string",
              "description": "头像url。 代开发自建应用需要管理员授权且成员oauth2授权获取；第三方仅通讯录应用可获取；对于非第三方创建的成员，第三方通讯录应用也不可获取；上游企业不可获取下游企业成员该字段"
            },
            "thumb_avatar": {
              "type": "string",
              "description": "头像缩略图url。第三方仅通讯录应用可获取；对于非第三方创建的成员，第三方通讯录应用也不可获取；上游企业不可获取下游企业成员该字段"
            },
            "telephone": {
              "type": "string",
              "description": "座机。代开发自建应用需要管理员授权才返回；第三方仅通讯录应用可获取；对于非第三方创建的成员，第三方通讯录应用也不可获取；上游企业不可获取下游企业成员该字段"
            },
            "alias": {
              "type": "string",
              "description": "别名；第三方仅通讯录应用可获取；对于非第三方创建的成员，第三方通讯录应用也不可获取；上游企业不可获取下游企业成员该字段"
            },
            "address": {
              "type": "string",
              "description": "地址。代开发自建应用需要管理员授权且成员oauth2授权获取；第三方仅通讯录应用可获取；对于非第三方创建的成员，第三方通讯录应用也不可获取；上游企业不可获取下游企业成员该字段"
            },
