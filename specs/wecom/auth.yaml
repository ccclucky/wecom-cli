{
  "domain": "auth",
  "operations": [
    {
      "name": "get_token",
      "cli_action": "get-token",
      "summary": "获取access_token",
      "method": "GET",
      "endpoint": "/cgi-bin/gettoken",
      "args": [
        {
          "name": "corpid",
          "flag": "--corpid",
          "type": "str",
          "help": "企业ID，获取方式参考：术语说明-corpid",
          "required": true
        },
        {
          "name": "corpsecret",
          "flag": "--corpsecret",
          "type": "str",
          "help": "应用的凭证密钥，注意应用需要是启用状态，获取方式参考：术语说明-secret",
          "required": true
        }
      ],
      "request": {
        "query": {
          "corpid": {
            "from_arg": "corpid"
          },
          "corpsecret": {
            "from_arg": "corpsecret"
          }
        }
      },
      "examples": [
        "wecom auth get-token --corpid ww1234567890 --corpsecret SECRET"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "出错返回码，为0表示成功，非0表示调用失败"
            },
            "errmsg": {
              "type": "string",
              "description": "返回码提示语"
            },
            "access_token": {
              "type": "string",
              "description": "获取到的凭证，最长为512字节"
            },
            "expires_in": {
              "type": "integer",
              "description": "凭证的有效时间（秒）"
            }
          },
          "required": [
            "errcode",
            "errmsg",
            "access_token",
            "expires_in"
          ]
        }
      },
      "doc": {
        "title": "接口代码参考示例",
        "source_url": "https://developer.work.weixin.qq.com/document/path/90469",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/gettoken?corpid=ID&corpsecret=SECRET",
        "request_params": [
          {
            "name": "corpid",
            "required": true,
            "description": "企业ID，获取方式参考：术语说明-corpid",
            "type": null
          },
          {
            "name": "corpsecret",
            "required": true,
            "description": "应用的凭证密钥，注意应用需要是启用状态，获取方式参考：术语说明-secret",
            "type": null
          }
        ],
        "response_params": [
          {
            "name": "errcode",
            "required": null,
            "description": "出错返回码，为0表示成功，非0表示调用失败",
            "type": null
          },
          {
            "name": "errmsg",
            "required": null,
            "description": "返回码提示语",
            "type": null
          },
          {
            "name": "access_token",
            "required": null,
            "description": "获取到的凭证，最长为512字节",
            "type": null
          },
          {
            "name": "expires_in",
            "required": null,
            "description": "凭证的有效时间（秒）",
            "type": null
          }
        ],
        "request_example_text": "public function getAccessToken($corpid,$secret) {      \n        //TODO: access_token 应该全局存储与更新，以下代码以写入到文件中做示例                      \n\t\t//TODO: 每个应用的access_token应独立存储，此处用secret作为区分应用的标识\n        $path = \"../cache/$secret.php\";\n        $data = json_decode(get_php_file($path));\n        \n        if($data->expire_time < time()) {                \n            $url = \"https://qyapi.weixin.qq.com/cgi-bin/gettoken?corpid=$corpid&corpsecret=$secret\";                      \n            $res = json_decode(http_get($url)[\"content\"]);\n\n            $access_token = $res->access_token;\n            \n            if($access_token) {\n                $data->expire_time = time() + 7000;\n                $data->access_token = $access_token;        \n                set_php_file($path, json_encode($data));\n            }\n        } else {\n            $access_token = $data->access_token;\n        }\n        return $access_token;    \n    }"
      }
    },
    {
      "name": "getuserdetail",
      "cli_action": "getuserdetail",
      "summary": "获取访问用户敏感信息",
      "method": "POST",
      "endpoint": "/cgi-bin/auth/getuserdetail",
      "args": [
        {
          "name": "user_ticket",
          "flag": "--user-ticket",
          "type": "str",
          "help": "成员票据",
          "required": true
        }
      ],
      "request": {
        "json_body": {
          "user_ticket": {
            "from_arg": "user_ticket"
          }
        }
      },
      "examples": [
        "wecom auth getuserdetail --user-ticket <user_ticket>"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "返回码"
            },
            "errmsg": {
              "type": "string",
              "description": "对返回码的文本描述内容"
            },
            "userid": {
              "type": "string",
