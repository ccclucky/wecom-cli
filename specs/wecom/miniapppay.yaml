            "from_arg": "商品小票ID"
          },
          "商户侧商品编码": {
            "from_arg": "商户侧商品编码"
          },
          "微信支付商品编码": {
            "from_arg": "微信支付商品编码"
          },
          "商品名称": {
            "from_arg": "商品名称"
          },
