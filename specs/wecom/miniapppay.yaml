          "flag": "--地区编码",
          "type": "str",
          "help": "地区编码，详细请见省市区编号对照表。"
        },
        {
          "name": "详细地址",
          "flag": "--详细地址",
          "type": "str",
          "help": "详细的商户门店地址"
        }
      ],
