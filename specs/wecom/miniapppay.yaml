{
  "domain": "miniapppay",
  "operations": [
    {
      "name": "close_order",
      "cli_action": "close-order",
      "summary": "关闭订单",
      "method": "POST",
      "endpoint": "/cgi-bin/miniapppay/close_order",
      "args": [
        {
          "name": "商户号",
          "flag": "--商户号",
          "type": "str",
          "help": "二级商户号，由企业微信生成并下发。",
          "required": true
        },
        {
          "name": "商户订单号",
          "flag": "--商户订单号",
          "type": "str",
          "help": "商户系统内部订单号，只能是数字、大小 写字母_-*且在同一个商户号下唯一。",
          "required": true
        }
      ],
      "request": {
        "json_body": {
          "商户号": {
            "from_arg": "商户号"
          },
          "商户订单号": {
            "from_arg": "商户订单号"
          }
        }
      },
      "examples": [
        "wecom miniapppay close-order --商户号 <商户号> --商户订单号 <商户订单号>"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer"
            },
            "errmsg": {
              "type": "string"
            }
          },
          "required": [
            "errcode",
            "errmsg"
          ]
        }
      },
      "doc": {
        "title": "关闭订单",
        "source_url": "https://developer.work.weixin.qq.com/document/path/97324",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/miniapppay/close_order?access_token=ACCESS_TOKEN",
        "request_params": [
          {
            "name": "商户号",
            "required": true,
            "description": "二级商户号，由企业微信生成并下发。",
            "type": "string[1,32]"
          },
          {
            "name": "商户订单号",
            "required": true,
            "description": "商户系统内部订单号，只能是数字、大小 写字母_-*且在同一个商户号下唯一。",
            "type": "string[6,32]"
          }
        ],
        "request_example_text": "{\n  \"mchid\" : \"xxx\",\n  \"out_trade_no\" : \"xxx\"\n}",
        "request_example_json": {
          "mchid": "xxx",
          "out_trade_no": "xxx"
        },
        "response_example_text": "{\n   \"errcode\": 0,\n   \"errmsg\": \"ok\"\n}",
        "response_example_json": {
          "errcode": 0,
          "errmsg": "ok"
        }
      }
    },
    {
      "name": "create_order",
      "cli_action": "create-order",
      "summary": "小程序下单",
      "method": "POST",
      "endpoint": "/cgi-bin/miniapppay/create_order",
      "args": [
        {
          "name": "应用ID",
          "flag": "--应用ID",
          "type": "str",
          "help": "二级商户申请的公众号或移动应用appid。",
          "required": true
        },
        {
          "name": "商户号",
          "flag": "--商户号",
          "type": "str",
          "help": "二级商户号，由企业微信生成并下发。",
          "required": true
        },
        {
          "name": "商户订单号",
          "flag": "--商户订单号",
          "type": "str",
          "help": "商户系统内部订单号，只能是数字、大小写字母、_-|* 且在同一个商户号下唯一。",
          "required": true
        },
        {
          "name": "商品描述",
          "flag": "--商品描述",
          "type": "str",
          "help": "商品描述",
          "required": true
        },
        {
          "name": "下单场景key",
          "flag": "--下单场景key",
          "type": "str",
          "help": "用来统计企微成员发出小程序的交易业绩，可从小程序URL获取。统计结果将在对外收款-成员业绩中展示。若不传入该项，则不做统计。"
        },
        {
          "name": "订单总金额",
          "flag": "--订单总金额",
          "type": "int",
          "help": "订单总金额，单位为分。",
          "required": true
        },
        {
          "name": "货币类型",
          "flag": "--货币类型",
          "type": "str",
          "help": "CNY：人民币，境内商户号仅支持人民币。",
          "required": true
        },
        {
          "name": "支付者标识",
          "flag": "--支付者标识",
          "type": "str",
          "help": "用户在子商户appid下的唯一标识。",
          "required": true
        },
        {
          "name": "交易结束时间",
          "flag": "--交易结束时间",
          "type": "str",
          "help": "订单失效时间，遵循rfc3339标准，格式为 yyyy-MM-DDTHH:mm:ss+TIMEZONE"
        },
        {
          "name": "附加数据",
          "flag": "--附加数据",
          "type": "str",
          "help": "附加数据，在查单和支付通知中原样返回"
        },
        {
          "name": "订单优惠标记",
          "flag": "--订单优惠标记",
          "type": "str",
          "help": "订单优惠标记"
        },
        {
          "name": "订单原价",
          "flag": "--订单原价",
          "type": "int",
          "help": "1、商户侧一张小票订单可能被分多次支付，订单原价用于记录整张小票的交易金额。 2、当订单原价与支付金额不相等，则不享受优惠。 3、该字段主要用于防止同一张小票分多次支付，以享受多次优惠的情况，正常支付订单不必上传此参数。"
        },
        {
          "name": "商品小票ID",
          "flag": "--商品小票ID",
          "type": "str",
          "help": "商家小票ID"
        },
        {
          "name": "商户侧商品编码",
          "flag": "--商户侧商品编码",
          "type": "str",
          "help": "由半角的大小写字母、数字、中划线、下划线中的一种或几种组成。",
          "required": true
        },
        {
          "name": "微信支付商品编码",
          "flag": "--微信支付商品编码",
          "type": "str",
          "help": "微信支付定义的统一商品编号（没有可不传）"
        },
        {
          "name": "商品名称",
          "flag": "--商品名称",
          "type": "str",
          "help": "商品的实际名称"
        },
        {
          "name": "商品数量",
          "flag": "--商品数量",
          "type": "int",
          "help": "用户购买的数量",
          "required": true
        },
        {
          "name": "商品单价",
          "flag": "--商品单价",
          "type": "int",
          "help": "商品单价，单位为分",
          "required": true
        },
        {
          "name": "用户终端IP",
          "flag": "--用户终端IP",
          "type": "str",
          "help": "用户的客户端IP，支持IPv4和IPv6两种格式的IP地址。",
          "required": true
        },
        {
          "name": "商户端设备号",
          "flag": "--商户端设备号",
          "type": "str",
          "help": "商户端设备号（门店号或收银设备ID）。"
        },
