      "args": [
        {
          "name": "cursor",
          "flag": "--cursor",
          "type": "str",
          "help": "上一次调用时返回的next_cursor，第一次拉取可以不填"
        },
        {
          "name": "limit",
          "flag": "--limit",
          "type": "str",
          "help": "本次查询返回的最大条数。不超过1000，默认200条"
