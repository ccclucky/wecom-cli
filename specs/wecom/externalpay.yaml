{
  "domain": "externalpay",
  "operations": [
    {
      "name": "get_bill_list",
      "cli_action": "get-bill-list",
      "summary": "获取对外收款记录",
      "method": "POST",
      "endpoint": "/cgi-bin/externalpay/get_bill_list",
      "args": [
        {
          "name": "begin_time",
          "flag": "--begin-time",
          "type": "str",
          "help": "收款记录开始时间戳，单位为秒",
          "required": true
        },
        {
          "name": "end_time",
          "flag": "--end-time",
          "type": "str",
          "help": "收款记录结束时间戳，单位为秒",
          "required": true
        },
        {
          "name": "payee_userid",
          "flag": "--payee-userid",
          "type": "str",
          "help": "企业收款成员userid，不填则为全部成员"
        },
        {
          "name": "cursor",
          "flag": "--cursor",
          "type": "str",
          "help": "用于分页查询的游标，字符串类型，由上一次调用返回，首次调用可不填"
        },
        {
          "name": "limit",
          "flag": "--limit",
          "type": "str",
          "help": "返回的最大记录数，整型，最大值1000"
        }
      ],
      "request": {
        "json_body": {
          "begin_time": {
            "from_arg": "begin_time"
          },
          "end_time": {
            "from_arg": "end_time"
          },
          "payee_userid": {
            "from_arg": "payee_userid"
          },
          "cursor": {
            "from_arg": "cursor"
          },
          "limit": {
            "from_arg": "limit"
          }
        }
      },
      "examples": [
        "wecom externalpay get-bill-list --begin-time <begin_time> --end-time <end_time> [--payee-userid <payee_userid>] [--cursor <cursor>] [--limit <limit>]"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "返回码"
            },
            "errmsg": {
              "type": "string",
              "description": "对返回码的文本描述内容"
            },
            "next_cursor": {
              "type": "string",
              "description": "分页游标，在下次请求时填写以获取之后分页的记录，如果已经没有更多的数据则不返回该字段"
            },
            "bill_list": {
              "type": "array",
              "items": {
                "type": "object",
                "properties": {
                  "transaction_id": {
                    "type": "string",
                    "description": "交易单号"
                  },
                  "bill_type": {
                    "type": "integer",
                    "description": "交易类型： 0：收款记录 1：退款记录"
                  },
                  "trade_state": {
                    "type": "integer",
                    "description": "交易状态（退款记录不返回该字段）： 1：已完成 3：已完成有退款"
                  },
                  "pay_time": {
                    "type": "integer",
                    "description": "交易时间"
                  },
                  "out_trade_no": {
                    "type": "string",
                    "description": "商户单号。如果是退款记录，返回对应收款记录的商户单号"
                  },
                  "out_refund_no": {
                    "type": "string",
                    "description": "退款单号，退款记录返回该字段"
                  },
                  "external_userid": {
                    "type": "string",
                    "description": "付款人的userid"
                  },
                  "total_fee": {
                    "type": "integer",
                    "description": "收款总金额，单位为分"
                  },
                  "payee_userid": {
                    "type": "string",
                    "description": "企业内账号userid。退款记录的该字段为退款成员userid，收款记录的该字段为收款成员userid"
                  },
                  "payment_type": {
                    "type": "integer",
                    "description": "收款方式： 0：在聊天中收款 1：收款码收款 2：在直播间收款 3：用产品图册收款 14：转账 15：小程序（仅部分灰度企业可在小程序中接入对外收款账户进行收款）"
                  },
                  "mch_id": {
                    "type": "string",
                    "description": "收款商户号id"
                  },
                  "remark": {
                    "type": "string",
                    "description": "备注。退款记录的该字段为退款备注，收款记录的该字段为收款备注"
                  },
                  "commodity_list": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "description": {
                          "type": "string"
                        },
                        "amount": {
                          "type": "integer"
                        }
                      },
                      "required": [
                        "description",
                        "amount"
                      ]
                    },
                    "description": "商品信息详情列表,商品信息结构参考commodity。退款记录不返回该字段"
                  },
                  "total_refund_fee": {
                    "type": "integer",
                    "description": "退款总金额"
                  },
                  "refund_list": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "out_refund_no": {
                          "type": "string",
                          "description": "退款单号，退款记录返回该字段"
                        },
                        "refund_userid": {
                          "type": "string"
                        },
                        "refund_comment": {
                          "type": "string"
                        },
                        "refund_reqtime": {
                          "type": "integer"
                        },
                        "refund_status": {
                          "type": "integer"
                        },
                        "refund_fee": {
                          "type": "integer"
                        }
                      },
                      "required": [
                        "out_refund_no",
                        "refund_userid",
                        "refund_comment",
                        "refund_reqtime",
                        "refund_status",
                        "refund_fee"
                      ]
                    },
                    "description": "退款单据详情列表，退款单据详情参考refund。退款记录不返回该字段"
                  },
                  "contact_info": {
                    "type": "object",
                    "properties": {
                      "name": {
                        "type": "string"
                      },
                      "phone": {
                        "type": "string"
                      },
                      "address": {
                        "type": "string"
                      }
                    },
                    "required": [
                      "name",
                      "phone",
                      "address"
                    ],
                    "description": "联系人信息，详情参考contact，如创建收款项目时设置为不需要联系地址，则该字段为空，第三方不可获取。退款记录不返回该字段"
                  },
                  "miniprogram_info": {
                    "type": "object",
                    "properties": {
                      "appid": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      }
                    },
                    "required": [
                      "appid",
                      "name"
                    ],
                    "description": "小程序信息，详情参考miniprogram。收款方式为小程序时返回该字段"
                  }
                },
                "required": [
                  "transaction_id",
                  "bill_type",
                  "trade_state",
                  "pay_time",
                  "out_trade_no",
                  "out_refund_no",
                  "external_userid",
                  "total_fee",
                  "payee_userid",
                  "payment_type",
                  "mch_id",
                  "remark",
                  "commodity_list",
                  "total_refund_fee",
                  "refund_list",
                  "contact_info",
                  "miniprogram_info"
                ]
              },
              "description": "交易单详情列表"
            }
          },
          "required": [
            "errcode",
            "errmsg",
            "next_cursor",
            "bill_list"
          ]
        }
      },
