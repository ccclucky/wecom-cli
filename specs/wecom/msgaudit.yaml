{
  "domain": "msgaudit",
  "operations": [
    {
      "name": "check_single_agree",
      "cli_action": "check-single-agree",
      "summary": "获取会话同意情况",
      "method": "POST",
      "endpoint": "/cgi-bin/msgaudit/check_single_agree",
      "args": [
        {
          "name": "info",
          "flag": "--info",
          "type": "str",
          "help": "待查询的会话信息，数组",
          "required": true
        },
        {
          "name": "userid",
          "flag": "--userid",
          "type": "str",
          "help": "内部成员的userid",
          "required": true
        },
        {
          "name": "exteranalopenid",
          "flag": "--exteranalopenid",
          "type": "str",
          "help": "外部成员的exteranalopenid",
          "required": true
        }
      ],
      "request": {
        "json_body": {
          "info": {
            "from_arg": "info"
          },
          "userid": {
            "from_arg": "userid"
          },
          "exteranalopenid": {
            "from_arg": "exteranalopenid"
          }
        }
      },
      "examples": [
        "wecom msgaudit check-single-agree --info <info> --userid <userid> --exteranalopenid <exteranalopenid>"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer"
            },
            "errmsg": {
              "type": "string"
            },
            "agreeinfo": {
              "type": "array",
              "items": {
                "type": "object",
                "properties": {
                  "status_change_time": {
                    "type": "integer"
                  },
                  "userid": {
                    "type": "string"
                  },
                  "exteranalopenid": {
                    "type": "string"
                  },
                  "agree_status": {
                    "type": "string"
                  }
                },
                "required": [
                  "status_change_time",
                  "userid",
                  "exteranalopenid",
                  "agree_status"
                ]
              }
            }
          },
          "required": [
            "errcode",
            "errmsg",
            "agreeinfo"
          ]
        }
      },
      "doc": {
        "title": "获取会话同意情况",
        "source_url": "https://developer.work.weixin.qq.com/document/path/91782",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/msgaudit/check_single_agree?access_token=ACCESS_TOKEN",
        "request_params": [
          {
            "name": "access_token",
            "required": true,
            "description": "调用接口凭证",
            "type": null
          },
          {
            "name": "info",
            "required": true,
            "description": "待查询的会话信息，数组",
            "type": null
          },
          {
            "name": "userid",
            "required": true,
            "description": "内部成员的userid",
            "type": null
          },
          {
            "name": "exteranalopenid",
            "required": true,
            "description": "外部成员的exteranalopenid",
            "type": null
          }
        ],
        "response_params": [
          {
            "name": "access_token",
            "required": true,
            "description": "调用接口凭证",
            "type": null
          },
          {
            "name": "roomid",
            "required": true,
            "description": "待查询的roomid",
            "type": null
          }
        ],
        "request_example_text": "{\n\"info\":[\n{\"userid\":\"XuJinSheng\",\"exteranalopenid\":\"wmeDKaCQAAGd9oGiQWxVsAKwV2HxNAAA\"},{\"userid\":\"XuJinSheng\",\"exteranalopenid\":\"wmeDKaCQAAIQ_p7ACn_jpLVBJSGocAAA\"},\n{\"userid\":\"XuJinSheng\",\"exteranalopenid\":\"wmeDKaCQAAPE_p7ABnxkpLBBJSGocAAA\"}\n]\n}",
        "request_example_json": {
