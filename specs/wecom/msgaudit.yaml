            "type": null
          },
          {
            "name": "msgtime",
            "required": null,
            "description": "消息发送时间戳，utc时间，ms单位。",
            "type": null
          },
          {
            "name": "msgtype",
            "required": null,
            "description": "文本消息为：text。String类型",
            "type": null
          },
          {
            "name": "content",
            "required": null,
            "description": "消息内容。String类型",
            "type": null
          }
        ],
        "response_params": [
          {
            "name": "errcode",
            "required": null,
            "description": "返回码",
