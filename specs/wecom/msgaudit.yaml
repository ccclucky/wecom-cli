        ],
        "request_example_text": "/*获取sdk对象，首次使用初始化*/\nWeWorkFinanceSdk_t* NewSdk();",
        "response_example_text": "{\n\t\"errcode\": 0,\n\t\"errmsg\": \"ok\",\n\t\"data\": {\n\t\t\"robot_id\": \"wbxxxxxxxxxxxxxxxxxxxxxxxx\",\n\t\t\"name\": \"机器人A\",\n\t\t\"creator_userid\": \"zhangsan\"\n\t}\n}",
        "response_example_json": {
