        }
      }
    },
    {
      "name": "get_permit_user_list",
      "cli_action": "get-permit-user-list",
      "summary": "获取会话内容存档开启成员列表",
      "method": "POST",
      "endpoint": "/cgi-bin/msgaudit/get_permit_user_list",
      "args": [
        {
          "name": "type",
          "flag": "--type",
          "type": "str",
          "help": "拉取对应版本的开启成员列表。1表示办公版；2表示服务版；3表示企业版。非必填，不填写的时候返回全量成员列表。"
        }
      ],
      "request": {
        "json_body": {
          "type": {
            "from_arg": "type"
          }
        }
      },
      "examples": [
        "wecom msgaudit get-permit-user-list [--type <type>]"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer"
            },
            "errmsg": {
              "type": "string"
            },
            "ids": {
              "type": "array",
              "items": {
                "type": "string"
              }
            }
          },
          "required": [
            "errcode",
            "errmsg",
            "ids"
          ]
        }
      },
      "doc": {
        "title": "获取会话内容存档开启成员列表",
        "source_url": "https://developer.work.weixin.qq.com/document/path/91614",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/msgaudit/get_permit_user_list?access_token=ACCESS_TOKEN",
        "request_params": [
          {
            "name": "access_token",
            "required": true,
            "description": "调用接口凭证",
            "type": null
          },
          {
            "name": "type",
            "required": false,
            "description": "拉取对应版本的开启成员列表。1表示办公版；2表示服务版；3表示企业版。非必填，不填写的时候返回全量成员列表。",
            "type": null
          }
        ],
        "request_example_text": "{\n\t\"type\":1\n}",
        "request_example_json": {
          "type": 1
        },
        "response_example_text": "{\n   \"errcode\": 0,\n   \"errmsg\": \"ok\",\n   \"ids\":[\n\t\t\"userid_111\",\n\t\t\"userid_222\",\n\t\t\"userid_333\"\n   ]\n}",
        "response_example_json": {
          "errcode": 0,
          "errmsg": "ok",
          "ids": [
            "userid_111",
            "userid_222",
            "userid_333"
          ]
        }
      }
    },
    {
      "name": "get_robot_info",
      "cli_action": "get-robot-info",
      "summary": "获取会话内容",
      "method": "GET",
      "endpoint": "/cgi-bin/msgaudit/get_robot_info",
      "args": [
        {
          "name": "msgid",
          "flag": "--msgid",
          "type": "str",
          "help": "消息id，消息的唯一标识，企业可以使用此字段进行消息去重。String类型"
        },
        {
          "name": "action",
          "flag": "--action",
          "type": "str",
          "help": "消息动作，目前有send(发送消息)/recall(撤回消息)/switch(切换企业日志)三种类型。String类型"
        },
        {
          "name": "from_",
          "flag": "--from-",
          "type": "str",
          "help": "消息发送方id。同一企业内容为userid，非相同企业为external_userid。消息如果是机器人发出，也为external_userid。String类型"
        },
        {
          "name": "tolist",
          "flag": "--tolist",
          "type": "str",
          "help": "消息接收方列表，可能是多个，同一个企业内容为userid，非相同企业为external_userid。数组，内容为string类型"
        },
        {
          "name": "roomid",
          "flag": "--roomid",
          "type": "str",
          "help": "群聊消息的群id。如果是单聊则为空。String类型"
        },
        {
          "name": "msgtime",
          "flag": "--msgtime",
          "type": "str",
          "help": "消息发送时间戳，utc时间，ms单位。"
        },
        {
          "name": "msgtype",
          "flag": "--msgtype",
          "type": "str",
          "help": "文本消息为：text。String类型"
        },
        {
          "name": "content",
          "flag": "--content",
          "type": "str",
          "help": "消息内容。String类型"
        }
      ],
      "request": {
        "query": {
          "msgid": {
            "from_arg": "msgid"
          },
          "action": {
            "from_arg": "action"
          },
          "from_": {
            "from_arg": "from_"
          },
          "tolist": {
            "from_arg": "tolist"
          },
          "roomid": {
            "from_arg": "roomid"
          },
          "msgtime": {
            "from_arg": "msgtime"
          },
          "msgtype": {
            "from_arg": "msgtype"
          },
          "content": {
            "from_arg": "content"
          }
        }
      },
      "examples": [
        "wecom msgaudit get-robot-info [--msgid <msgid>] [--action <action>] [--from- <from_>] [--tolist <tolist>] [--roomid <roomid>] [--msgtime <msgtime>] [--msgtype <msgtype>] [--content <content>]"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "返回码"
            },
            "errmsg": {
              "type": "string",
              "description": "对返回码的文本描述内容"
            },
            "data": {
              "type": "object",
              "properties": {
                "robot_id": {
                  "type": "string",
                  "description": "机器人ID"
                },
                "name": {
                  "type": "string",
                  "description": "机器人名称"
                },
                "creator_userid": {
                  "type": "string",
                  "description": "机器人创建者的UserID"
                }
              },
              "required": [
                "robot_id",
                "name",
                "creator_userid"
              ]
            }
          },
          "required": [
            "errcode",
            "errmsg",
            "data"
          ]
        }
      },
      "doc": {
