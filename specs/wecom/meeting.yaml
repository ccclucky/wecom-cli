      "doc": {
        "title": "修改网络研讨会",
        "source_url": "https://developer.work.weixin.qq.com/document/path/98843",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/meeting/webinar/update?access_token=ACCESS_TOKEN",
        "request_params": [
          {
            "name": "access_token",
            "required": true,
            "description": "调用接口凭证。获取方法查看“获取access_token”",
            "type": "string"
          },
          {
            "name": "meetingid",
            "required": true,
            "description": "网络研讨会ID。",
            "type": "string"
          },
          {
            "name": "title",
            "required": true,
            "description": "网络研讨会主题（1~255位字符长度）。",
            "type": "string"
          },
          {
            "name": "sponsor",
            "required": false,
            "description": "主办方名称（1~40位字符长度）。",
            "type": "string"
          },
          {
            "name": "start_time",
            "required": true,
            "description": "会议开始时间戳（单位秒），不能少于当前时间戳半小时以上。",
            "type": "string"
          },
          {
            "name": "end_time",
            "required": true,
            "description": "会议结束时间戳（单位秒）。",
            "type": "string"
          },
          {
            "name": "admission_type",
            "required": true,
            "description": "观众观看限制类型： 0：公开 1：报名 2：密码",
            "type": "uint32"
          },
          {
            "name": "hosts",
            "required": false,
            "description": "主持人的成员 ID，默认为网络研讨会管理员admin_userid。 注意：修改时传入，则会覆盖原有设置。详见HostInfo 。",
            "type": "object[]"
          },
          {
            "name": "password",
            "required": false,
            "description": "观众观看密码（4~6位数字），当 admission_type = 2 时必传，且仅当 admission_type = 2 时才生效。",
            "type": "string"
          },
          {
            "name": "cover_url",
            "required": false,
            "description": "封面图片 URL，图片仅支持 PNG 和 JPEG 格式，分辨率需大于640360，推荐使用1280720的高清图片，文件需控制在 5 MB 以内。 该参数需要开启活动页配置（activity_page）。 接口上传封面方式为异步上传，可通过订阅 素材上传结果 获得上传结果通知。",
            "type": "string"
          },
          {
            "name": "description",
            "required": false,
            "description": "网络研讨会描述详情，仅支持纯文本，1~5000位字符长度。 该参数需要开启活动页配置（activity_page）。",
            "type": "string"
          },
          {
            "name": "enable_guest_invite_link",
            "required": false,
            "description": "是否开启通过邀请链接自动成为嘉宾： true：开启 false：不开启，默认 false。",
            "type": "bool"
          },
          {
            "name": "media_setting",
            "required": false,
            "description": "媒体参数配置。详见MediaSetting。",
            "type": "object[]"
          },
          {
            "name": "enable_qa",
            "required": false,
            "description": "是否开启问答： true：开启 false：不开启，默认 true。",
            "type": "bool"
          },
          {
            "name": "sensitive_words",
            "required": false,
            "description": "聊天敏感词，包含敏感词的观众公共聊天将不会出现在您的会议中，最多可添加50个敏感词，单个敏感词限制10个中文字符长度。",
            "type": "string[]"
          },
          {
            "name": "enable_manual_check",
            "required": false,
            "description": "是否开启人工审核： true：开启 false：不开启，默认 false。",
            "type": "bool"
          },
          {
            "name": "activity_page",
            "required": false,
            "description": "活动页开启配置： true：开启活动页，默认开启。 false：不开启活动页。 查询时返回默认值true。",
            "type": "bool"
          },
          {
            "name": "display_number_of_attendees",
            "required": false,
            "description": "活动页展示已报名或已预约人数： 0：不展示 1：展示，默认开启。 该参数需要开启活动页配置（activity_page）。",
            "type": "uint32"
          },
          {
            "name": "playback_for_audience",
            "required": true,
            "description": "允许观众观看回放。 true：允许 false：不允许，默认值为 false 开启本选项时必须开启云录制，即 auto_record_type 的值必须为 cloud。",
            "type": "bool"
          },
          {
            "name": "preparation_mode",
            "required": false,
            "description": "是否开启准备模式： true：开启 false：关闭",
            "type": "bool"
          }
        ],
        "response_params": [
          {
            "name": "errcode",
            "required": null,
            "description": "返回码",
            "type": "int32"
          },
          {
            "name": "errmsg",
            "required": null,
            "description": "对返回码的文本描述内容",
            "type": "string"
          }
        ],
        "request_example_text": "{\n\t\"meetingid\": \"MEETINGID\",\n\t\"title\": \"TITLE\",\n\t\"sponsor\": \"SPONSOR\",\n\t\"start_time\": \"166666666\",\n\t\"end_time\": \"177777777\",\n\t\"admission_type\": 0,\n\t\"hosts\": [\n\t\t{\n\t\t\t\"userid\": \"USERID\"\n\t\t}\n\t],\n\t\"password\": \"PASSWORD\",\n\t\"cover_url\": \"URL\",\n\t\"description\": \"description\",\n\t\"enable_guest_invite_link\": false,\n\t\"media_setting\": {\n\t\t\"enable_enter_mute\": false,\n\t\t\"allow_unmute_self\": false,\n\t\t\"allow_enter_before_host\": false,\n\t\t\"enable_screen_watermark\": false,\n\t\t\"watermark_type\": 0,\n\t\t\"allow_external_user\": false,\n\t\t\"auto_record_type\": \"none\",\n\t\t\"attendee_join_auto_record\": false,\n\t\t\"enable_host_pause_auto_record\": false\n\t},\n\t\"enable_qa\": false,\n\t\"sensitive_words\": [\n\t\t\"WORD1\"\n\t],\n\t\"enable_manual_check\": false,\n\t\"activity_page\": false,\n\t\"display_number_of_attendees\": 0,\n\t\"playback_for_audience\": true,\n\t\"preparation_mode\": false\n}",
        "request_example_json": {
