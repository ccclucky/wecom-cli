    {
      "name": "cancel",
      "cli_action": "cancel",
      "summary": "取消预约会议",
      "method": "POST",
      "endpoint": "/cgi-bin/meeting/cancel",
      "args": [
        {
          "name": "meetingid",
          "flag": "--meetingid",
          "type": "str",
          "help": "会议id，仅允许取消预约状态下的会议",
          "required": true
        }
      ],
      "request": {
        "json_body": {
          "meetingid": {
            "from_arg": "meetingid"
          }
        }
      },
      "examples": [
        "wecom meeting cancel --meetingid <meetingid>"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "返回码"
            },
            "errmsg": {
              "type": "string",
              "description": "对返回码的文本描述内容"
            }
          },
          "required": [
            "errcode",
            "errmsg"
          ]
        }
      },
      "doc": {
        "title": "取消预约会议",
        "source_url": "https://developer.work.weixin.qq.com/document/path/99048",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/meeting/cancel?access_token=ACCESS_TOKEN",
        "request_params": [
          {
            "name": "access_token",
            "required": true,
            "description": "调用接口凭证。获取方法查看“获取access_token”",
            "type": null
          },
          {
            "name": "meetingid",
            "required": true,
            "description": "会议id，仅允许取消预约状态下的会议",
            "type": null
          }
        ],
        "response_params": [
          {
            "name": "errcode",
            "required": null,
            "description": "返回码",
            "type": null
          },
          {
            "name": "errmsg",
            "required": null,
            "description": "对返回码的文本描述内容",
            "type": null
          }
        ],
        "request_example_text": "{\n   \"meetingid\": \"XXXXXXXXX\"\n}",
        "request_example_json": {
          "meetingid": "XXXXXXXXX"
        },
        "response_example_text": "{\n   \"errcode\": 0,\n   \"errmsg\": \"ok\"\n}",
        "response_example_json": {
          "errcode": 0,
          "errmsg": "ok"
        }
      }
    },
    {
      "name": "create",
      "cli_action": "create",
      "summary": "创建预约会议",
      "method": "POST",
      "endpoint": "/cgi-bin/meeting/create",
      "args": [
        {
          "name": "admin_userid",
          "flag": "--admin-userid",
          "type": "str",
          "help": "会议管理员userid",
          "required": true
        },
        {
          "name": "title",
          "flag": "--title",
          "type": "str",
          "help": "会议的标题，最多支持40个字节或者20个utf8字符",
          "required": true
        },
        {
          "name": "meeting_start",
          "flag": "--meeting-start",
          "type": "str",
          "help": "会议开始时间的unix时间戳。需大于当前时间",
          "required": true
        },
        {
          "name": "meeting_duration",
          "flag": "--meeting-duration",
          "type": "str",
          "help": "会议持续时间（单位秒），最小300秒，最大86399秒",
          "required": true
        },
        {
          "name": "description",
          "flag": "--description",
          "type": "str",
          "help": "会议的描述，最多支持500个字节或者utf8字符"
        },
        {
          "name": "location",
          "flag": "--location",
          "type": "str",
          "help": "会议地点,最多128个字符"
        },
        {
          "name": "agentid",
          "flag": "--agentid",
          "type": "str",
          "help": "授权方安装的应用agentid。仅旧的第三方多应用套件需要填此参数"
        },
        {
          "name": "invitees",
          "flag": "--invitees",
          "type": "str",
          "help": "邀请参会的成员。任何userid不合法或者不在应用可见范围，直接报错。参会人数上限不超过指定的「管理员」可预约的人数的上限，普通企业参会人员最多为100人；付费企业由企业选购的在线会议室或高级账号对应的容量决定，但最多为300人，超过300人请调用更新会议受邀成员列表接口。"
        },
        {
          "name": "invitees_userid",
          "flag": "--invitees-userid",
          "type": "str",
          "help": "参与会议的企业成员userid"
        },
        {
          "name": "cal_id",
          "flag": "--cal-id",
          "type": "str",
          "help": "会议所属日历ID。该日历必须是access_token所对应应用所创建的日历。 注意，若参与人在日历分享范围内，则插入到该日历（同时会插入会议参与人的默认日历），若不在分享范围内，否则仅插入到参与者默认日历； 如果不填，那么插入到参与者的默认日历上。 第三方应用必须指定cal_id 不多于64字节"
        },
        {
          "name": "settings",
          "flag": "--settings",
          "type": "str",
          "help": "会议配置，详见Settings"
        },
        {
          "name": "reminders",
          "flag": "--reminders",
          "type": "str",
          "help": "重复会议相关配置，详见Reminders"
        }
      ],
      "request": {
        "json_body": {
          "admin_userid": {
            "from_arg": "admin_userid"
          },
          "title": {
            "from_arg": "title"
          },
          "meeting_start": {
            "from_arg": "meeting_start"
          },
          "meeting_duration": {
            "from_arg": "meeting_duration"
          },
          "description": {
            "from_arg": "description"
          },
          "location": {
            "from_arg": "location"
          },
          "agentid": {
            "from_arg": "agentid"
          },
          "invitees": {
            "from_arg": "invitees"
          },
          "invitees_userid": {
            "from_arg": "invitees_userid"
          },
          "cal_id": {
            "from_arg": "cal_id"
          },
          "settings": {
            "from_arg": "settings"
          },
          "reminders": {
            "from_arg": "reminders"
          }
        }
      },
      "examples": [
        "wecom meeting create --admin-userid <admin_userid> --title <title> --meeting-start <meeting_start> --meeting-duration <meeting_duration> [--description <description>] [--location <location>] [--agentid <agentid>] [--invitees <invitees>] [--invitees-userid <invitees_userid>] [--cal-id <cal_id>] [--settings <settings>] [--reminders <reminders>]"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "返回码"
            },
            "errmsg": {
              "type": "string",
              "description": "对返回码的文本描述内容"
            },
            "meetingid": {
              "type": "string",
              "description": "会议id，通过此id可调用“进入会议”接口(包括小程序接口和JS-SDK接口)，以向参会人提供便捷入会入口"
            },
            "excess_users": {
              "type": "array",
              "items": {
                "type": "string"
              },
              "description": "参会人中包含无效会议账号的userid，仅在购买会议专业版企业由于部分参会人无有效会议账号时返回"
            }
          },
          "required": [
            "errcode",
            "errmsg",
            "meetingid",
            "excess_users"
          ]
        }
      },
