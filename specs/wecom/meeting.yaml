            "from_arg": "activity_page"
          },
          "display_number_of_attendees": {
            "from_arg": "display_number_of_attendees"
          },
          "playback_for_audience": {
            "from_arg": "playback_for_audience"
          },
          "preparation_mode": {
            "from_arg": "preparation_mode"
          }
        }
      },
      "examples": [
        "wecom meeting webinar-update --meetingid <meetingid> --title <title> [--sponsor <sponsor>] --start-time <start_time> --end-time <end_time> --admission-type <admission_type> [--hosts <hosts>] [--password <password>] [--cover-url <cover_url>] [--description <description>] [--enable-guest-invite-link <enable_guest_invite_link>] [--media-setting <media_setting>] [--enable-qa <enable_qa>] [--sensitive-words <sensitive_words>] [--enable-manual-check <enable_manual_check>] [--activity-page <activity_page>] [--display-number-of-attendees <display_number_of_attendees>] --playback-for-audience <playback_for_audience> [--preparation-mode <preparation_mode>]"
      ],
