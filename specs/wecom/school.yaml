{
  "domain": "school",
  "operations": [
    {
      "name": "agent_get_allow_scope",
      "cli_action": "agent-get-allow-scope",
      "summary": "获取可使用的家长范围",
      "method": "GET",
      "endpoint": "/cgi-bin/school/agent/get_allow_scope",
      "args": [
        {
          "name": "agentid",
          "flag": "--agentid",
          "type": "str",
          "help": "应用id",
          "required": true
        }
      ],
      "request": {
        "query": {
          "agentid": {
            "from_arg": "agentid"
          }
        }
      },
      "examples": [
        "wecom school agent-get-allow-scope --agentid <agentid>"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "出错返回码，为0表示成功，非0表示调用失败"
            },
            "errmsg": {
              "type": "string",
              "description": "返回码提示语"
            },
            "allow_scope": {
              "type": "object",
              "properties": {
                "students": {
                  "type": "object",
                  "properties": {
                    "userid": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      }
                    }
                  },
                  "required": [
                    "userid"
                  ]
                },
                "departments": {
                  "type": "object",
                  "properties": {
                    "partyid": {
                      "type": "array",
                      "items": {
                        "type": "integer"
                      }
                    }
                  },
                  "required": [
                    "partyid"
                  ]
                }
              },
              "required": [
                "students",
                "departments"
              ],
              "description": "可在微信「学校通知-学校应用」使用该应用的家长范围"
            }
          },
          "required": [
            "errcode",
            "errmsg",
            "allow_scope"
          ]
        }
      },
      "doc": {
        "title": "获取可使用的家长范围",
        "source_url": "https://developer.work.weixin.qq.com/document/path/94895",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/school/agent/get_allow_scope?access_token=ACCESS_TOKEN&agentid=AGENTID",
        "request_params": [
          {
            "name": "access_token",
            "required": true,
            "description": "调用接口凭证",
            "type": null
          },
          {
            "name": "agentid",
            "required": true,
            "description": "应用id",
            "type": null
          }
        ],
        "response_params": [
          {
            "name": "errcode",
            "required": null,
            "description": "出错返回码，为0表示成功，非0表示调用失败",
            "type": null
          },
          {
            "name": "errmsg",
            "required": null,
            "description": "返回码提示语",
            "type": null
          },
          {
            "name": "allow_scope",
            "required": null,
            "description": "可在微信「学校通知-学校应用」使用该应用的家长范围",
            "type": null
          },
          {
            "name": "allow_scope_students_userid",
            "required": null,
            "description": "家长可在微信「学校通知-学校应用」使用该应用的学生列表",
            "type": null
          },
          {
            "name": "allow_scope_departments_partyid",
            "required": null,
            "description": "家长可在微信「学校通知-学校应用」使用该应用的部门列表",
            "type": null
          }
        ],
        "response_example_text": "{\n   \"errcode\": 0,\n   \"errmsg\": \"ok\",\n   \"allow_scope\": {\n       \"students\": {\n             \"userid\": [\"student1\", \"student2\"]\n       },\n\t   \"departments\": {\n             \"partyid\": [1, 2]\n\t   }\n    }\n}",
        "response_example_json": {
          "errcode": 0,
          "errmsg": "ok",
          "allow_scope": {
            "students": {
              "userid": [
                "student1",
                "student2"
              ]
            },
            "departments": {
              "partyid": [
                1,
                2
              ]
            }
          }
        },
        "permissions": [
          "注： 从2023年12月1日0点起，不再支持通过系统应用secret调用接口，存量企业暂不受影响 查看详情"
        ]
      }
    },
    {
      "name": "department_create",
      "cli_action": "department-create",
      "summary": "创建部门",
      "method": "POST",
      "endpoint": "/cgi-bin/school/department/create",
      "args": [
        {
          "name": "name",
          "flag": "--name",
          "type": "str",
          "help": "部门名称。长度限制为1~32个字符，字符不能包括-:*?\"<>/，*，当设置了入学年份和标准年级时，该参数将被忽略"
        },
        {
          "name": "parentid",
          "flag": "--parentid",
          "type": "str",
          "help": "父部门id，32位整型",
          "required": true
        },
        {
          "name": "id",
          "flag": "--id",
          "type": "str",
          "help": "部门id，32位整型，指定时必须大于1。若不填该参数，将自动生成id"
        },
        {
          "name": "type",
          "flag": "--type",
          "type": "str",
          "help": "部门类型，32位整型，1表示班级，2表示年级，3表示学段，4表示校区",
          "required": true
        },
        {
          "name": "standard_grade",
          "flag": "--standard-grade",
          "type": "str",
          "help": "标准年级，32位整型，参数值含义详见标准年级对照表，仅当部门类型为年级（2）时生效"
        },
        {
          "name": "register_year",
          "flag": "--register-year",
          "type": "str",
          "help": "入学年份，32位整型，格式为YYYY，输入范围为1970～2100，仅当部门类型为年级（2）时生效，如果在创建标准年级时不填此参数，则由系统自动计算出入学年份"
        },
        {
          "name": "order",
          "flag": "--order",
          "type": "str",
          "help": "在父部门中的次序值。order值大的排序靠前。有效的值范围是[0, 2^32)"
        },
        {
          "name": "department_admins",
          "flag": "--department-admins",
          "type": "str",
          "help": "部门管理员列表"
        },
        {
          "name": "department_admins_userid",
          "flag": "--department-admins-userid",
          "type": "str",
          "help": "对应管理端的账号，企业内必须唯一。不区分大小写，长度为1~64个字节",
          "required": true
        },
        {
          "name": "department_admins_type",
          "flag": "--department-admins-type",
          "type": "str",
          "help": "部门管理员类型， 1表示校区负责人，2表示年级负责人，3表示班主任，4表示任课老师，5表示学段负责人",
          "required": true
        },
        {
          "name": "department_admins_subject",
          "flag": "--department-admins-subject",
          "type": "str",
          "help": "教师的科目，仅班主任和任课老师可以设置，科目的最多15个字符，仅支持设置一个科目"
        }
      ],
      "request": {
        "json_body": {
          "name": {
            "from_arg": "name"
          },
          "parentid": {
            "from_arg": "parentid"
          },
          "id": {
            "from_arg": "id"
          },
          "type": {
            "from_arg": "type"
          },
          "standard_grade": {
            "from_arg": "standard_grade"
          },
          "register_year": {
            "from_arg": "register_year"
          },
          "order": {
            "from_arg": "order"
          },
          "department_admins": {
            "from_arg": "department_admins"
          },
          "department_admins_userid": {
            "from_arg": "department_admins_userid"
          },
          "department_admins_type": {
            "from_arg": "department_admins_type"
          },
          "department_admins_subject": {
            "from_arg": "department_admins_subject"
          }
        }
      },
      "examples": [
        "wecom school department-create [--name <name>] --parentid <parentid> [--id <id>] --type <type> [--standard-grade <standard_grade>] [--register-year <register_year>] [--order <order>] [--department-admins <department_admins>] --department-admins-userid <department_admins_userid> --department-admins-type <department_admins_type> [--department-admins-subject <department_admins_subject>]"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "返回码"
            },
            "errmsg": {
              "type": "string",
              "description": "对返回码的文本描述内容"
            },
            "id": {
              "type": "integer",
              "description": "创建的部门id"
            }
          },
          "required": [
            "errcode",
            "errmsg",
            "id"
          ]
        }
      },
      "doc": {
        "title": "创建部门",
        "source_url": "https://developer.work.weixin.qq.com/document/path/92340",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/school/department/create?access_token=ACCESS_TOKEN",
        "request_params": [
          {
            "name": "access_token",
            "required": true,
            "description": "调用接口凭证",
            "type": null
          },
          {
            "name": "name",
            "required": false,
            "description": "部门名称。长度限制为1~32个字符，字符不能包括-:*?\"<>/，*，当设置了入学年份和标准年级时，该参数将被忽略",
            "type": null
          },
          {
            "name": "parentid",
            "required": true,
            "description": "父部门id，32位整型",
            "type": null
          },
          {
            "name": "id",
            "required": false,
            "description": "部门id，32位整型，指定时必须大于1。若不填该参数，将自动生成id",
            "type": null
          },
          {
            "name": "type",
            "required": true,
            "description": "部门类型，32位整型，1表示班级，2表示年级，3表示学段，4表示校区",
            "type": null
          },
          {
            "name": "standard_grade",
            "required": false,
            "description": "标准年级，32位整型，参数值含义详见标准年级对照表，仅当部门类型为年级（2）时生效",
            "type": null
          },
          {
            "name": "register_year",
            "required": false,
            "description": "入学年份，32位整型，格式为YYYY，输入范围为1970～2100，仅当部门类型为年级（2）时生效，如果在创建标准年级时不填此参数，则由系统自动计算出入学年份",
            "type": null
          },
          {
            "name": "order",
            "required": false,
            "description": "在父部门中的次序值。order值大的排序靠前。有效的值范围是[0, 2^32)",
            "type": null
          },
          {
            "name": "department_admins",
            "required": false,
            "description": "部门管理员列表",
            "type": null
          },
          {
            "name": "department_admins_userid",
            "required": true,
            "description": "对应管理端的账号，企业内必须唯一。不区分大小写，长度为1~64个字节",
            "type": null
          },
          {
            "name": "department_admins_type",
            "required": true,
            "description": "部门管理员类型， 1表示校区负责人，2表示年级负责人，3表示班主任，4表示任课老师，5表示学段负责人",
            "type": null
          },
          {
            "name": "department_admins_subject",
            "required": false,
            "description": "教师的科目，仅班主任和任课老师可以设置，科目的最多15个字符，仅支持设置一个科目",
            "type": null
          }
        ],
        "response_params": [
          {
            "name": "errcode",
            "required": null,
            "description": "返回码",
            "type": null
          },
          {
            "name": "errmsg",
            "required": null,
            "description": "对返回码的文本描述内容",
            "type": null
          },
          {
            "name": "id",
            "required": null,
            "description": "创建的部门id",
            "type": null
          }
        ],
        "request_example_text": "{\n   \"name\": \"一年级\",\n   \"parentid\": 5,\n   \"id\": 2,\n   \"type\": 1,\n   \"register_year\":2018,\n   \"standard_grade\":1,\n   \"order\":1,\n   \"department_admins\": [\n\t   {\n\t\t   \"userid\": \"zhangsan\",\n\t\t   \"type\": 4,\n\t\t   \"subject\":\"语文\"\n\t   },\n\t   {\n\t\t   \"userid\": \"lisi\",\n\t\t   \"type\": 3,\n\t\t   \"subject\":\"数学\"\n\t   }\n\t]\n}",
        "request_example_json": {
          "name": "一年级",
          "parentid": 5,
          "id": 2,
          "type": 1,
          "register_year": 2018,
          "standard_grade": 1,
          "order": 1,
          "department_admins": [
            {
              "userid": "zhangsan",
              "type": 4,
              "subject": "语文"
            },
            {
              "userid": "lisi",
              "type": 3,
              "subject": "数学"
            }
          ]
        },
        "response_example_text": "{\n   \"errcode\": 0,\n   \"errmsg\": \"created\",\n   \"id\": 2\n}",
        "response_example_json": {
          "errcode": 0,
          "errmsg": "created",
          "id": 2
        },
        "permissions": [
          "注： 从2023年12月1日0点起，不再支持通过系统应用secret调用接口，存量企业暂不受影响 查看详情"
        ],
        "notes": [
          "注意，班级的父部门必须是年级，也就是说type为1的部门的父部门type值必须是2。\n如果创建的标准年级为小学二年级，当前为2019年，则系统默认的入学年份为2018年，依次类推。\n管理员类型须与部门类型保持一致，即校区负责人只能配置到校区部门，班主任和任课老师只能设置到班级。"
        ],
        "review_hints": [
          "Review doc.notes for conditional fields, limits, and permission caveats."
        ]
      }
