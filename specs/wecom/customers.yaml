          "qr_code": "https://p.qpic.cn/wwhead/duc2TvpEgSdicZ9RrdUtBkv2UiaA/0"
        },
        "permissions": [
          "调用接口的应用需要满足如下的权限：",
          "配置客户联系「联系我」方式",
          "企业可以在管理后台-客户联系-加客户中配置成员的「联系我」的二维码或者小程序按钮，客户通过扫描二维码或点击小程序上的按钮，即可获取成员联系方式，主动联系到成员。\n企业可通过此接口为具有客户联系功能的成员生成专属的「联系我」二维码或者「联系我」按钮。\n如果配置的是「联系我」按钮，需要开发者的小程序接入小程序插件。",
          "注意:\n通过API添加的「联系我」不会在管理端进行展示，每个企业可通过API最多配置50万个「联系我」。\n用户需要妥善存储返回的config_id，config_id丢失可能导致用户无法编辑或删除「联系我」。\n临时会话模式不占用「联系我」数量，但每日最多添加10万个，并且仅支持单人。\n临时会话模式的二维码，添加好友完成后该二维码即刻失效。",
          "请求方式：POST（HTTPS）\n请求地址：https://qyapi.weixin.qq.com/cgi-bin/externalcontact/add_contact_way?access_token=ACCESS_TOKEN"
        ],
        "notes": [
          "注意，每个联系方式最多配置100个使用成员（包含部门展开后的成员）\n当设置为临时会话模式时（即is_temp为true），联系人仅支持配置为单人，暂不支持多人\n使用unionid需要调用方（企业或服务商）的企业微信“客户联系”中已绑定微信开发者账户\nparty或user必须在应用可见范围或客户可建联的成员范围内",
          "注意：已失效的临时会话联系方式无法进行编辑\n当临时会话模式时（即is_temp为true），联系人仅支持配置为单人，暂不支持多人\nparty或user必须在应用可见范围或客户可建联的成员范围内",
          "注意：请保证传入的企业成员和客户之间有仍然有效的临时会话, 通过其他方式的添加外部联系人无法通过此接口关闭会话。",
          "text、image、link和miniprogram四者不能同时为空；\ntext与另外三者可以同时发送，此时将会以两条消息的形式触达客户;\nimage、link和miniprogram只能有一个，如果三者同时填，则按image、link、miniprogram的优先顺序取参，也就是说，如果image与link同时传值，则只有image生效;\nmedia_id可以通过素材管理接口获得;\n构造结束语使用image消息时，只能填写meida_id字段,获取含有image结构的联系我方式时，返回pic_url字段。"
        ],
        "review_hints": [
          "Review doc.notes for conditional fields, limits, and permission caveats."
        ]
