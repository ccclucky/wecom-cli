          "注意:\n如果填写了group_id参数，则group_name和标签组的order参数会被忽略。\n如果填写的group_name和此规则组下的其他标签组同名，则会将相关标签加入已存在的同名标签组下\n不支持创建空标签组。\n标签组内的标签不可同名，如果传入多个同名标签，则只会创建一个。",
          "注意:修改后的标签组不能和已有的标签组重名，标签也不能和同一标签组下的其他标签重名。",
          "tag_id和group_id不可同时为空。\n如果一个标签组下所有的标签均被删除，则标签组会被自动删除。"
        ],
        "review_hints": [
