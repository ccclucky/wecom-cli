{
  "domain": "customers",
  "operations": [
    {
      "name": "add_contact_way",
      "cli_action": "add-contact-way",
      "summary": "客户联系「联系我」管理",
      "method": "POST",
      "endpoint": "/cgi-bin/externalcontact/add_contact_way",
      "args": [
        {
          "name": "type",
          "flag": "--type",
          "type": "str",
          "help": "联系方式类型,1-单人, 2-多人",
          "required": true
        },
        {
          "name": "scene",
          "flag": "--scene",
          "type": "str",
          "help": "场景，1-在小程序中联系，2-通过二维码联系",
          "required": true
        },
        {
          "name": "style",
          "flag": "--style",
          "type": "str",
          "help": "在小程序中联系时使用的控件样式，详见附表"
        },
        {
          "name": "remark",
          "flag": "--remark",
          "type": "str",
          "help": "联系方式的备注信息，用于助记，不超过30个字符"
        },
        {
          "name": "skip_verify",
          "flag": "--skip-verify",
          "type": "bool",
          "help": "外部客户添加时是否无需验证，默认为true"
        },
        {
          "name": "state",
          "flag": "--state",
          "type": "str",
          "help": "企业自定义的state参数，用于区分不同的添加渠道，在调用“获取客户详情”时会返回该参数值，不超过30个字符"
        },
        {
          "name": "user",
          "flag": "--user",
          "type": "str",
          "help": "使用该联系方式的用户userID列表，在type为1时为必填，且只能有一个"
        },
        {
          "name": "party",
          "flag": "--party",
          "type": "str",
          "help": "使用该联系方式的部门id列表，只在type为2时有效"
        },
        {
          "name": "is_temp",
          "flag": "--is-temp",
          "type": "bool",
          "help": "是否临时会话模式，true表示使用临时会话模式，默认为false"
        },
        {
          "name": "expires_in",
          "flag": "--expires-in",
          "type": "str",
          "help": "临时会话二维码有效期，以秒为单位。该参数仅在is_temp为true时有效，默认7天，最多为14天"
        },
        {
          "name": "chat_expires_in",
          "flag": "--chat-expires-in",
          "type": "str",
          "help": "临时会话有效期，以秒为单位。该参数仅在is_temp为true时有效，默认为添加好友后24小时，最多为14天"
        },
        {
          "name": "unionid",
          "flag": "--unionid",
          "type": "str",
          "help": "可进行临时会话的客户unionid，该参数仅在is_temp为true时有效，如不指定则不进行限制"
        },
        {
          "name": "is_exclusive",
          "flag": "--is-exclusive",
          "type": "bool",
          "help": "是否开启同一外部企业客户只能添加同一个员工，默认为否，开启后，同一个企业的客户会优先添加到同一个跟进人"
        },
        {
          "name": "mark_source",
          "flag": "--mark-source",
          "type": "bool",
          "help": "是否标记客户添加来源为该应用创建的「联系我」, 默认为true; 仅对「营销获客」应用生效"
        },
        {
          "name": "conclusions",
          "flag": "--conclusions",
          "type": "str",
          "help": "结束语，会话结束时自动发送给客户，可参考“结束语定义”，仅在is_temp为true时有效"
        }
      ],
      "request": {
        "json_body": {
          "type": {
            "from_arg": "type"
          },
          "scene": {
            "from_arg": "scene"
          },
          "style": {
            "from_arg": "style"
          },
          "remark": {
            "from_arg": "remark"
          },
          "skip_verify": {
            "from_arg": "skip_verify"
          },
          "state": {
            "from_arg": "state"
          },
          "user": {
            "from_arg": "user"
          },
          "party": {
            "from_arg": "party"
          },
          "is_temp": {
            "from_arg": "is_temp"
          },
          "expires_in": {
            "from_arg": "expires_in"
          },
          "chat_expires_in": {
            "from_arg": "chat_expires_in"
          },
          "unionid": {
            "from_arg": "unionid"
          },
          "is_exclusive": {
            "from_arg": "is_exclusive"
          },
          "mark_source": {
            "from_arg": "mark_source"
          },
          "conclusions": {
            "from_arg": "conclusions"
          }
        }
      },
      "examples": [
        "wecom customers add-contact-way --type <type> --scene <scene> [--style <style>] [--remark <remark>] [--skip-verify <skip_verify>] [--state <state>] [--user <user>] [--party <party>] [--is-temp <is_temp>] [--expires-in <expires_in>] [--chat-expires-in <chat_expires_in>] [--unionid <unionid>] [--is-exclusive <is_exclusive>] [--mark-source <mark_source>] [--conclusions <conclusions>]"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "返回码"
            },
            "errmsg": {
              "type": "string",
              "description": "对返回码的文本描述内容"
            },
            "config_id": {
              "type": "string",
              "description": "新增联系方式的配置id"
            },
            "qr_code": {
              "type": "string",
              "description": "联系我二维码链接，仅在scene为2时返回"
            }
          },
          "required": [
            "errcode",
            "errmsg",
            "config_id",
            "qr_code"
          ]
        }
      },
