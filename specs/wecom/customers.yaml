        "request_example_text": "{\n   \"type\" :1,\n   \"scene\":1,\n   \"style\":1,\n   \"remark\":\"渠道客户\",\n   \"skip_verify\":true,\n   \"state\":\"teststate\",\n   \"user\" : [\"zhangsan\", \"lisi\", \"wangwu\"],\n   \"party\" : [2, 3],\n   \"is_temp\":true,\n   \"expires_in\":86400,\n   \"chat_expires_in\":86400,\n   \"unionid\":\"oxTWIuGaIt6gTKsQRLau2M0AAAA\",\n   \"is_exclusive\":true,\n   \"mark_source\":true,\n   \"conclusions\":\n   {\n\t\t\"text\": \n\t\t{\n\t\t\t\"content\":\"文本消息内容\"\n\t\t},\n    \t\"image\": \n\t\t{\n        \t\"media_id\": \"MEDIA_ID\"\n   \t\t},\n    \t\"link\":\n\t\t{\n        \t\"title\": \"消息标题\",\n        \t\"picurl\": \"https://example.pic.com/path\",\n        \t\"desc\": \"消息描述\",\n        \t\"url\": \"https://example.link.com/path\"\n    \t},\n    \t\"miniprogram\":\n\t\t{\n        \t\"title\": \"消息标题\",\n\t\t\t\"pic_media_id\": \"MEDIA_ID\",\n        \t\"appid\": \"wx8bd80126147dfAAA\",\n        \t\"page\": \"/path/index.html\"\n    \t}\n   }\n}",
