          "to_student_userid": [
            "student_userid1",
            "student_userid2"
          ],
          "to_party": [
            "partyid1",
            "partyid2"
          ],
          "toall": 0,
          "msgtype": "text",
          "agentid": 1,
          "text": {
            "content": "你的快递已到，请携带工卡前往邮件中心领取。\n出发前可查看<a href=\"http://work.weixin.qq.com\">邮件中心视频实况</a>，聪明避开排队。"
          },
          "enable_id_trans": 0,
          "enable_duplicate_check": 0,
          "duplicate_check_interval": 1800
        },
        "response_example_text": "{\n  \"errcode\" : 0,\n  \"errmsg\" : \"ok\",\n  \"invalid_parent_userid\" : [\"parent_userid1\"],\n  \"invalid_student_userid\" : [\"student_userid1\"],\n  \"invalid_party\" : [\"party1\"]\n}",
        "response_example_json": {
          "errcode": 0,
          "errmsg": "ok",
          "invalid_parent_userid": [
            "parent_userid1"
          ],
          "invalid_student_userid": [
            "student_userid1"
          ],
          "invalid_party": [
            "party1"
          ]
        },
        "notes": [
          "各个消息类型的具体POST格式参考以下文档。\n支持id转译，将userid/部门id转成对应的企业通讯录内部的用户名/部门名，目前仅文本/图文/图文（mpnews）/小程序消息这四种消息类型的部分字段支持。具体支持的范围和语法，请查看附录id转译说明。\n支持重复消息检查，当指定 \"enable_duplicate_check\": 1开启: 表示在一定时间间隔内，同样内容（请求json）的消息，不会重复收到；时间间隔可通过duplicate_check_interval指定，默认1800秒。",
          "如果部分接收人无权限或不存在，发送仍然执行，但会返回无效的部分（invalid_parent_userid/invalid_student_userid/invalid_party）。",
          "mpnews类型的图文消息，跟普通的图文消息一致，唯一的差异是图文内容存储在企业微信。\n多次发送mpnews，会被认为是不同的图文，阅读、点赞的统计会被分开计算。"
        ],
