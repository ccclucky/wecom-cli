    {
      "name": "get_user_all_livingid",
      "cli_action": "get-user-all-livingid",
      "summary": "获取老师直播ID列表",
      "method": "POST",
      "endpoint": "/cgi-bin/living/get_user_all_livingid",
      "args": [
        {
          "name": "userid",
          "flag": "--userid",
          "type": "str",
          "help": "企业成员的userid",
          "required": true
        },
        {
          "name": "cursor",
          "flag": "--cursor",
          "type": "str",
          "help": "上一次调用时返回的next_cursor，第一次拉取可以不填"
        },
        {
          "name": "limit",
          "flag": "--limit",
          "type": "str",
          "help": "每次拉取的数据量，默认值和最大值都为100"
        }
      ],
      "request": {
        "json_body": {
          "userid": {
            "from_arg": "userid"
          },
          "cursor": {
            "from_arg": "cursor"
          },
          "limit": {
            "from_arg": "limit"
          }
        }
      },
      "examples": [
        "wecom living get-user-all-livingid --userid <userid> [--cursor <cursor>] [--limit <limit>]"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "返回码"
            },
            "errmsg": {
              "type": "string",
              "description": "对返回码的文本描述内容"
            },
            "next_cursor": {
              "type": "string",
              "description": "当前数据最后一个key值，如果下次调用带上该值则从该key值往后拉，用于实现分页拉取，返回空字符串代表已经是最后一页"
            },
            "livingid_list": {
              "type": "array",
              "items": {
                "type": "string"
              },
              "description": "直播ID列表"
            }
          },
          "required": [
            "errcode",
            "errmsg",
            "next_cursor",
            "livingid_list"
          ]
        }
