{
  "domain": "appchat",
  "operations": [
    {
      "name": "get",
      "cli_action": "get",
      "summary": "获取群聊会话",
      "method": "GET",
      "endpoint": "/cgi-bin/appchat/get",
      "args": [
        {
          "name": "chatid",
          "flag": "--chatid",
          "type": "str",
          "help": "群聊id",
          "required": true
        }
      ],
      "request": {
        "query": {
          "chatid": {
            "from_arg": "chatid"
          }
        }
      },
      "examples": [
        "wecom appchat get --chatid <chatid>"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "返回码"
            },
            "errmsg": {
              "type": "string",
              "description": "对返回码的文本描述内容"
            },
            "chat_info": {
              "type": "object",
              "properties": {
                "chatid": {
                  "type": "string",
                  "description": "群聊唯一标志"
                },
                "name": {
                  "type": "string",
                  "description": "群聊名"
                },
                "owner": {
                  "type": "string",
                  "description": "群主id"
                },
                "userlist": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  },
                  "description": "群成员id列表"
                },
                "chat_type": {
                  "type": "integer",
                  "description": "群聊类型，0表示普通群聊，1表示课程群聊"
                }
              },
              "required": [
                "chatid",
                "name",
                "owner",
                "userlist",
                "chat_type"
              ],
              "description": "群聊信息"
            }
          },
          "required": [
            "errcode",
            "errmsg",
            "chat_info"
          ]
        }
      },
      "doc": {
        "title": "获取群聊会话",
        "source_url": "https://developer.work.weixin.qq.com/document/path/98914",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/appchat/get?access_token=ACCESS_TOKEN&chatid=CHATID",
        "request_params": [
          {
            "name": "access_token",
            "required": true,
            "description": "调用接口凭证",
            "type": null
          },
          {
            "name": "chatid",
            "required": true,
            "description": "群聊id",
            "type": null
          }
        ],
        "response_params": [
          {
            "name": "errcode",
            "required": null,
            "description": "返回码",
            "type": null
          },
          {
            "name": "errmsg",
            "required": null,
            "description": "对返回码的文本描述内容",
            "type": null
          },
          {
            "name": "chat_info",
            "required": null,
            "description": "群聊信息",
            "type": null
          },
          {
            "name": "chatid",
            "required": null,
            "description": "群聊唯一标志",
            "type": null
          },
          {
            "name": "name",
            "required": null,
            "description": "群聊名",
            "type": null
          },
          {
            "name": "owner",
            "required": null,
            "description": "群主id",
            "type": null
          },
          {
            "name": "userlist",
            "required": null,
            "description": "群成员id列表",
            "type": null
          },
          {
            "name": "chat_type",
            "required": null,
            "description": "群聊类型，0表示普通群聊，1表示课程群聊",
            "type": null
          }
        ],
        "response_example_text": "{\n   \"errcode\" : 0,\n   \"errmsg\" : \"ok\",\n   \"chat_info\" : {\n      \"chatid\" : \"CHATID\",\n      \"name\" : \"NAME\",\n      \"owner\" : \"userid2\",\n      \"userlist\" : [\"userid1\", \"userid2\", \"userid3\"],\n      \"chat_type\" : 0\n   }\n }",
        "response_example_json": {
          "errcode": 0,
          "errmsg": "ok",
          "chat_info": {
            "chatid": "CHATID",
            "name": "NAME",
            "owner": "userid2",
            "userlist": [
              "userid1",
              "userid2",
              "userid3"
            ],
            "chat_type": 0
          }
        }
      }
    },
    {
      "name": "update",
      "cli_action": "update",
      "summary": "修改群聊会话",
      "method": "POST",
      "endpoint": "/cgi-bin/appchat/update",
      "args": [
        {
          "name": "chatid",
          "flag": "--chatid",
          "type": "str",
          "help": "群聊id",
          "required": true
        },
        {
          "name": "name",
          "flag": "--name",
          "type": "str",
          "help": "新的群聊名。若不需更新，请忽略此参数。最多50个utf8字符，超过将截断"
        },
        {
          "name": "owner",
          "flag": "--owner",
          "type": "str",
          "help": "新群主的id。若不需更新，请忽略此参数。课程群聊群主必须拥有课程群创建权限，del_user_list包含群主时本字段必填"
        },
        {
          "name": "add_user_list",
          "flag": "--add-user-list",
          "type": "str",
          "help": "添加成员的id列表"
        },
        {
          "name": "del_user_list",
          "flag": "--del-user-list",
          "type": "str",
          "help": "踢出成员的id列表"
        }
      ],
      "request": {
        "json_body": {
          "chatid": {
            "from_arg": "chatid"
          },
          "name": {
            "from_arg": "name"
          },
          "owner": {
            "from_arg": "owner"
          },
          "add_user_list": {
            "from_arg": "add_user_list"
          },
          "del_user_list": {
            "from_arg": "del_user_list"
          }
        }
      },
      "examples": [
        "wecom appchat update --chatid <chatid> [--name <name>] [--owner <owner>] [--add-user-list <add_user_list>] [--del-user-list <del_user_list>]"
      ],
      "output": {
        "formats": [
          "json"
        ],
        "json_schema": {
          "type": "object",
          "properties": {
            "errcode": {
              "type": "integer",
              "description": "返回码"
            },
            "errmsg": {
              "type": "string",
              "description": "对返回码的文本描述内容"
            }
          },
          "required": [
            "errcode",
            "errmsg"
          ]
        }
      },
      "doc": {
        "title": "修改群聊会话",
        "source_url": "https://developer.work.weixin.qq.com/document/path/98913",
        "request_url": "https://qyapi.weixin.qq.com/cgi-bin/appchat/update?access_token=ACCESS_TOKEN",
        "request_params": [
          {
            "name": "access_token",
            "required": true,
            "description": "调用接口凭证",
            "type": null
          },
          {
            "name": "chatid",
            "required": true,
            "description": "群聊id",
            "type": null
          },
          {
            "name": "name",
            "required": false,
            "description": "新的群聊名。若不需更新，请忽略此参数。最多50个utf8字符，超过将截断",
            "type": null
          },
          {
            "name": "owner",
            "required": false,
            "description": "新群主的id。若不需更新，请忽略此参数。课程群聊群主必须拥有课程群创建权限，del_user_list包含群主时本字段必填",
            "type": null
          },
          {
            "name": "add_user_list",
            "required": false,
            "description": "添加成员的id列表",
            "type": null
          },
          {
            "name": "del_user_list",
            "required": false,
            "description": "踢出成员的id列表",
            "type": null
          }
        ],
        "response_params": [
          {
            "name": "errcode",
            "required": null,
            "description": "返回码",
            "type": null
          },
          {
            "name": "errmsg",
            "required": null,
            "description": "对返回码的文本描述内容",
            "type": null
          }
        ],
        "request_example_text": "{\n    \"chatid\" : \"CHATID\",\n    \"name\" : \"NAME\",\n    \"owner\" : \"userid2\",\n    \"add_user_list\" : [\"userid1\", \"userid2\", \"userid3\"],\n    \"del_user_list\" : [\"userid3\", \"userid4\"]\n}",
        "request_example_json": {
          "chatid": "CHATID",
          "name": "NAME",
          "owner": "userid2",
          "add_user_list": [
            "userid1",
            "userid2",
            "userid3"
          ],
          "del_user_list": [
            "userid3",
            "userid4"
          ]
        },
        "response_example_text": "{\n   \"errcode\" : 0,\n   \"errmsg\" : \"ok\"\n }",
        "response_example_json": {
          "errcode": 0,
          "errmsg": "ok"
        },
        "permissions": [
          "限制说明：\nchatid所代表的群必须是该应用所创建。\n群成员人数不可超过2000人。\n每企业变更群的次数不可超过1000次/小时。"
        ]
      }
    }
  ]
}