name: Auto Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    # The version commit pushed by this job must not start another release.
    if: ${{ !contains(github.event.head_commit.message || '', '[skip release]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decide and bump version
        id: bump
        run: python scripts/bump_version.py

      - name: Commit, tag and push
        if: steps.bump.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore(release): ${VERSION} [skip release]"
          git tag "${TAG}"
          git push origin HEAD:main
          git push origin "${TAG}"

      # Tags pushed with GITHUB_TOKEN do not start the tag-triggered Release
      # workflow, so it is dispatched against the new tag explicitly.
      - name: Trigger publish workflow
        if: steps.bump.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: gh workflow run release.yml --ref "${TAG}"
