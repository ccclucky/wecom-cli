name: WeCom Catalog Watch

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  watch-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Discover latest API catalog
        run: |
          python scripts/discover_wecom_apis.py \
            --seed-file specs/wecom/seeds.txt \
            --max-pages 2000 \
            --output artifacts/catalog.discovery.yaml

      - name: Build diff report
        id: diff
        run: |
          set +e
          python scripts/catalog_diff_report.py \
            --baseline specs/wecom/catalog.yaml \
            --discovered artifacts/catalog.discovery.yaml \
            --report artifacts/wecom-catalog-report.md \
            --diff-output artifacts/catalog.diff.yaml \
            --sync-output artifacts/catalog.synced.yaml \
            --apply-baseline specs/wecom/catalog.yaml
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wecom-catalog-report
          path: artifacts/

      - name: Create or update tracking issue
        if: steps.diff.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[WeCom Catalog Watch] API changes detected';
            const body = fs.readFileSync('artifacts/wecom-catalog-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'wecom,catalog-watch',
              per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['wecom', 'catalog-watch'],
              });
              core.info(`Created issue #${created.data.number}`);
            }

      - name: Auto sync specs and generated code
        if: steps.diff.outputs.exit_code == '1'
        run: |
          python scripts/scaffold_from_catalog.py --catalog specs/wecom/catalog.yaml --spec-dir specs/wecom --apply
          python scripts/sync_spec_docs.py --catalog specs/wecom/catalog.yaml --spec-dir specs/wecom --apply
          python scripts/codegen.py
          python scripts/check_api_coverage.py
          python scripts/catalog_diff_report.py \
            --baseline specs/wecom/catalog.yaml \
            --discovered artifacts/catalog.discovery.yaml \
            --report artifacts/wecom-catalog-report.md \
            --diff-output artifacts/catalog.diff.yaml \
            --sync-output artifacts/catalog.synced.yaml
          python scripts/build_agent_tasks.py --catalog specs/wecom/catalog.yaml --spec-dir specs/wecom --diff artifacts/catalog.diff.yaml
          python - <<'PY'
          import json
          from pathlib import Path

          diff_payload = json.loads(Path("artifacts/catalog.diff.yaml").read_text(encoding="utf-8"))
          tasks_payload = json.loads(Path("artifacts/implementation.tasks.yaml").read_text(encoding="utf-8"))
          summary = diff_payload.get("summary", {})
          counts = {
              "added": int(summary.get("added", 0)),
              "removed": int(summary.get("removed", 0)),
              "modified": int(summary.get("modified", 0)),
              "task_count": int(tasks_payload.get("task_count", 0)),
          }
          if any(counts.values()):
              raise SystemExit(f"workflow did not converge to clean state: {counts}")
          print(counts)
          PY
      - name: Build Coding Agent artifacts
        run: |
          python scripts/build_agent_tasks.py --catalog specs/wecom/catalog.yaml --spec-dir specs/wecom --diff artifacts/catalog.diff.yaml
      - name: Create sync PR draft when changes detected
        if: steps.diff.outputs.exit_code == '1'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: sync discovered wecom catalog snapshot"
          branch: chore/sync-wecom-catalog
          title: "chore: sync discovered WeCom catalog snapshot"
          body-path: artifacts/wecom-catalog-report.md
          draft: true
