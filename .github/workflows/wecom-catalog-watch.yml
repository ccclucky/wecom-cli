name: WeCom Catalog Watch

on:
  schedule:
    # 22:00 UTC = 06:00 Beijing time.
    - cron: '7 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: wecom-catalog-watch
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  watch-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      # Cheap, fast liveness check for the doc-site login cookie. It must never
      # block the sweep: a dead cookie only means the crawl runs unauthenticated
      # (slower), and the resumable sweep still finishes. The result is written
      # to the step summary so every scheduled run self-reports cookie health.
      - name: Probe cookie health
        if: always()
        continue-on-error: true
        env:
          WECOM_DOC_COOKIE: ${{ secrets.WECOM_DOC_COOKIE }}
        run: |
          cd scripts
          python check_doc_cookie.py --cookie "$WECOM_DOC_COOKIE" --output ../cookie_probe.json || true
          cd ..
          if [ -f cookie_probe.json ]; then
            {
              echo "### Cookie health"
              echo
              echo '```json'
              cat cookie_probe.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # A dead cookie is invisible in the run's own outcome: the sweep still
      # succeeds anonymously, just slower. Turn the probe result into a
      # tracking issue so staleness has a durable record, and auto-close it
      # once the secret is refreshed and the probe turns valid again.
      - name: Track stale cookie in issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('cookie_probe.json')) {
              core.warning('No cookie probe result was produced; skipping cookie issue tracking.');
              return;
            }
            const probe = JSON.parse(fs.readFileSync('cookie_probe.json', 'utf8'));
            const healthy = probe.status === 'valid' && probe.is_login === true;
            const { owner, repo } = context.repo;
            const title = '[WeCom Catalog Watch] WECOM_DOC_COOKIE needs refresh';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'wecom,catalog-watch',
              per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (healthy) {
              if (existing) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
                core.info(`Cookie is valid again; closed issue #${existing.number}`);
              }
              return;
            }
            const body = [
              '`WECOM_DOC_COOKIE` no longer authenticates against the WeCom doc site.',
              'Without it the crawl runs unauthenticated and gets cut off after ~25 minutes,',
              'so a full sweep takes several scheduled runs instead of one.',
              '',
              'Probe result:',
              '',
              '```json',
              JSON.stringify(probe, null, 2),
              '```',
              '',
              'Fix: sign in to developer.work.weixin.qq.com, copy the full Cookie header, then run:',
              '',
              '```',
              'gh secret set WECOM_DOC_COOKIE',
              '```',
              '',
              'This issue closes automatically on the next watch run whose probe reports a valid cookie.',
            ].join('\n');
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['wecom', 'catalog-watch'],
              });
              core.info(`Created issue #${created.data.number}`);
            }

      # The doc site stops serving a runner after roughly 25 minutes of
      # crawling regardless of how many requests it made: runs that sent 354
      # requests and runs that sent 198 were cut off at the same wall clock
      # point. Both files therefore have to survive a run that ends early:
      # empty_pages.json remembers pages that never yield an API, and
      # crawl_state.json remembers where the current sweep stopped.
      - name: Restore crawl state
        uses: actions/cache/restore@v4
        with:
          path: |
            specs/wecom/crawl_state.json
            specs/wecom/empty_pages.json
          key: wecom-crawl-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wecom-crawl-state-

      - name: Discover latest API catalog
        id: discover
        env:
          WECOM_DOC_COOKIE: ${{ secrets.WECOM_DOC_COOKIE }}
        run: |
          COOKIE_ARG=()
          if [ -n "$WECOM_DOC_COOKIE" ]; then
            COOKIE_ARG=(--cookie "$WECOM_DOC_COOKIE")
          fi
          python scripts/update_menu_tree.py \
            --output specs/wecom/menu_tree.json \
            "${COOKIE_ARG[@]}"
          set +e
          python scripts/discover_wecom_apis.py \
            --seed-file specs/wecom/seeds.txt \
            --menu-tree-file specs/wecom/menu_tree.json \
            --empty-pages-file specs/wecom/empty_pages.json \
            --crawl-state-file specs/wecom/crawl_state.json \
            --time-budget 1080 \
            --request-budget 500 \
            --max-pages 1500 \
            --delay-min 1.0 \
            --delay-max 2.0 \
            --output artifacts/catalog.discovery.yaml \
            --stats-output artifacts/crawl-stats.json \
            "${COOKIE_ARG[@]}"
          code=$?
          set -e
          if [ "$code" -eq 4 ]; then
            echo "partial=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Sweep paused before the site's cutoff; progress is saved and the next run continues."
            exit 0
          fi
          exit "$code"

      - name: Persist crawl state
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            specs/wecom/crawl_state.json
            specs/wecom/empty_pages.json
          key: wecom-crawl-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report sweep progress
        if: steps.discover.outputs.partial == 'true'
        run: |
          SUMMARY=$(python - <<'PY'
          import json
          from pathlib import Path

          stats = json.loads(Path("artifacts/crawl-stats.json").read_text(encoding="utf-8"))
          print(
              f"Sweep progress: **{stats['pages_done']}/{stats['pages_total']}** pages "
              f"({stats['progress_pct']}%), {stats['pending_pages']} left, "
              f"{stats['operations_found']} operations collected so far."
          )
          PY
          )
          echo "$SUMMARY"
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      # A crawl cut short by anti-bot protection produces a snapshot that looks
      # like "230 APIs were deleted". Fail here so the diff never runs against
      # a partial catalog.
      - name: Verify crawl completeness
        if: steps.discover.outputs.partial != 'true'
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          stats = json.loads(Path("artifacts/crawl-stats.json").read_text(encoding="utf-8"))
          print(json.dumps(stats, indent=2))
          if stats.get("aborted"):
              print("::error::Crawl aborted by anti-bot protection; refusing to diff an incomplete snapshot.")
              sys.exit(1)
          if stats.get("operations_found", 0) == 0:
              print("::error::Crawl discovered zero operations.")
              sys.exit(1)
          PY

      - name: Build diff report
        id: diff
        if: steps.discover.outputs.partial != 'true'
        run: |
          set +e
          python scripts/catalog_diff_report.py \
            --baseline specs/wecom/catalog.yaml \
            --discovered artifacts/catalog.discovery.yaml \
            --report artifacts/wecom-catalog-report.md \
            --diff-output artifacts/catalog.diff.yaml \
            --sync-output artifacts/catalog.synced.yaml \
            --apply-baseline specs/wecom/catalog.yaml
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 3 ]; then
            echo "::error::Coverage gate failed - the crawl did not re-cover enough of the baseline."
            exit 1
          fi
          echo "diff exit code: $code"

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wecom-catalog-report
          path: artifacts/
          retention-days: 14

      - name: Create or update tracking issue
        if: steps.diff.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[WeCom Catalog Watch] API changes detected';
            const body = fs.readFileSync('artifacts/wecom-catalog-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'wecom,catalog-watch',
              per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['wecom', 'catalog-watch'],
              });
              core.info(`Created issue #${created.data.number}`);
            }

      - name: Apply catalog sync and regenerate code
        if: steps.diff.outputs.exit_code == '1'
        run: |
          python scripts/scaffold_from_catalog.py --catalog specs/wecom/catalog.yaml --spec-dir specs/wecom --apply
          python scripts/sync_spec_docs.py --catalog specs/wecom/catalog.yaml --spec-dir specs/wecom --apply
          python scripts/codegen.py
          python scripts/build_agent_tasks.py --catalog specs/wecom/catalog.yaml --spec-dir specs/wecom --diff artifacts/catalog.diff.yaml

      # Generated code must at least lint and pass the existing test suite
      # before it is allowed onto main.
      - name: Quality gate
        if: steps.diff.outputs.exit_code == '1'
        run: |
          ruff check .
          pytest -q

      - name: Create or update sync PR
        id: pr
        if: steps.diff.outputs.exit_code == '1'
        uses: peter-evans/create-pull-request@v6
        with:
          # Catalog changes alter the generated client and CLI, so they are a
          # feature from the package's point of view, not a chore.
          commit-message: "feat(catalog): sync discovered WeCom API catalog"
          branch: chore/sync-wecom-catalog
          title: "feat(catalog): sync discovered WeCom API catalog"
          body-path: artifacts/wecom-catalog-report.md
          draft: false

      # The PR is a review trail, not a gate: lint and tests already ran above.
      # GitHub does not start workflows for pull requests opened with
      # GITHUB_TOKEN, so waiting on the PR's own CI would stall forever.
      - name: Merge sync PR
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          gh pr ready "$PR_NUMBER" || true
          gh pr merge "$PR_NUMBER" --squash --delete-branch

      # Pushes performed with GITHUB_TOKEN do not trigger other workflows, so
      # the release pipeline is dispatched explicitly.
      - name: Trigger release workflow
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run auto-release.yml --ref main
