[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wecom-cli"
version = "0.1.0a1"
description = "WeCom CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wecom = "cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Auto-generated files may have long help strings and Chinese text
"cli/generated_commands.py" = ["E501"]
"apis/generated_client.py" = ["E501"]
# Scripts use long strings for prompts, URLs, error messages
"scripts/*.py" = ["E501"]
# Tests may have long assertion lines
"tests/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["core", "cli", "apis", "models", "tests"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true
